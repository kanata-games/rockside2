<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d0f1a;

.btn.on{transform:translateY(5px) scale(.94);box-shadow:0 1px 0 #070a14;color:#fff;}

.round{border-radius:50%;}
#bS{border-color:#b85068;background:#2c1822;}
#bS.on{background:#d8466a;border-color:#ffb3c4;}
#bJ{border-color:#4fae6e;background:#16281e;}
#bJ.on{background:#3fbf68;border-color:#bfffd2;}
#bM{border:2px solid #8acbe8;background:#15384d;color:#d7faff;border-radius:50%;font:800 10px/1 system-ui,sans-serif;pointer-events:auto;z-index:5;touch-action:none;}
#bM.on{background:#3484aa;border-color:#e1ffff;}
#bSupport{border:2px solid #ffa8cf;background:#40243d;color:#fff1f8;border-radius:50%;font:800 9px/1 system-ui,sans-serif;pointer-events:auto;z-index:5;touch-action:none;}
#bSupport.on{background:#a94275;border-color:white;}

#mute{position:absolute;box-sizing:border-box;padding:0 10px;height:30px;border-radius:15px;text-align:center;
  border:2px solid #3a4666;background:#141a2c;color:#9fb0d8;font:700 12px/26px system-ui,sans-serif;letter-spacing:1px;
  pointer-events:auto;white-space:nowrap;}

#hint{position:absolute;left:0;width:100%;text-align:center;color:#46557a;font:600 11px/1.3 system-ui,sans-serif;pointer-events:none;letter-spacing:1px;}
body.land .btn{opacity:.6;}
body.land .btn.on{opacity:.9;}
body.land #hint{display:none;}

#mMenu{position:fixed;z-index:18;display:none;box-sizing:border-box;pointer-events:none;color:#e2f1fa;font-family:system-ui,sans-serif;--mu:1px}

#mMenu button[aria-selected="true"]{background:#244f65;border-color:#91e5ef;color:#fff3c0}
#mMenuClose{margin-left:auto}
#mStatus{pointer-events:auto;background:rgba(11,20,38,.98);border:calc(1 * var(--mu)) solid #baa16c;border-top:0;padding:calc(10 * var(--mu));height:calc(176 * var(--mu));box-sizing:border-box;font-size:calc(7 * var(--mu));line-height:1.55;overflow:auto}
#mStatus .status-top{display:flex;gap:calc(10 * var(--mu));align-items:center;margin-bottom:calc(7 * var(--mu))}
#mStatus .portrait.seiten{background-image:url('assets/seiten-sequel-reference.png');background-size:165.802% 221.069%;background-position:63.805% 29.004%}#mStatus .portrait.astarte{background-image:url('assets/astarte-sequel-face.png');background-size:100% 100%;background-position:center}
#mStatus .portrait{width:calc(56 * var(--mu));height:calc(56 * var(--mu));flex-shrink:0;background-color:#182338;background-image:url('assets/umine-expressions.png');background-size:313.5% 313.5%;background-position:22.248% 23.419%;border:calc(1 * var(--mu)) solid #8daec2;image-rendering:auto}
#mStatus h2{font-size:calc(11 * var(--mu));margin:0 0 calc(3 * var(--mu));color:#fff1bd}
#mStatus .hp-track{height:calc(5 * var(--mu));width:calc(130 * var(--mu));background:#303d55;margin-top:calc(3 * var(--mu))}
#mStatus .hp-fill{height:100%;background:#89e3f0}
#mStatus .status-row{padding:calc(5 * var(--mu)) 0;border-top:calc(1 * var(--mu)) solid #384458}
#mStatus strong{color:#a5e5f0}#mStatus .note{color:#ddcda9}

html:has(body.mansion-menu-open),body.mansion-menu-open{touch-action:pan-y}
body.mansion-menu-open #pad,body.mansion-menu-open #mSlide,body.mansion-menu-open #mMap,body.mansion-menu-open #mSwap,body.mansion-menu-open #mAbility,body.mansion-menu-open #mVial{visibility:hidden;pointer-events:none}
#mMenu{pointer-events:auto;background:#0b1426;border:1px solid #baa16c;flex-direction:column;touch-action:pan-y;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
#mMenuBar{flex-shrink:0;border:0;border-bottom:1px solid #baa16c;align-items:center}

#mMenuBody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#mStatus{height:auto;min-height:100%;border:0;overflow:visible;font-size:clamp(13px,calc(8 * var(--mu)),18px);touch-action:pan-y}
#mStatus .hp-track{width:min(100%,calc(130 * var(--mu)))}
#mStatus .status-top>div:last-child{flex:1;min-width:0}
#mMapContent{padding:16px;color:#d5e5ee;font-size:14px;line-height:1.7;touch-action:pan-y}
#mMapContent h2{color:#fff1bd;font-size:20px;margin:0 0 12px}
#mMapContent .map-scroll{overflow-x:auto;touch-action:pan-x pan-y}#mMapContent svg{display:block;width:100%;min-width:360px;height:auto;margin:18px 0}

#mMenuBar{gap:3px;padding:6px}#mMenuBar button{padding:6px 8px;font-size:clamp(12px,calc(8 * var(--mu)),17px)}
#mAreaContent{padding:16px;font-size:14px;line-height:1.8;color:#d5e5ee}#mAreaContent h2{color:#fff1bd;font-size:20px}#mAreaContent #mAreaGo{width:100%;min-height:64px;background:#244f65;border-color:#91e5ef}#mAreaGo:disabled{opacity:.5}.warp-list{display:grid;gap:10px}.warp-list button{width:100%;min-height:48px;text-align:left;background:#302344;border-color:#a780d1}.warp-list button:disabled{opacity:.45}
#mTalk{padding:20px;font-size:clamp(16px,calc(9 * var(--mu)),20px);line-height:1.85;color:#edf3fa}
#mTalk header{display:flex;align-items:center;gap:16px;margin-bottom:20px}#mTalkPortrait{width:96px;height:96px;background:#182338;border:1px solid #baa16c;image-rendering:pixelated}#mTalk h2{color:#f4c795;margin:0;font-size:22px}#mTalkText{white-space:pre-line}#mTalkSeiten,#mTalkDice,#mTalkBattle{width:100%;margin-top:12px;background:#493161!important;min-height:48px}#mMenuBar{flex-wrap:wrap}#mBattleLeave{min-height:48px}#mTalkNext{display:block;width:100%;margin-top:26px;background:#244f65!important}
</style>

#modelPicker{position:fixed;z-index:12;display:flex;gap:5px;justify-content:center;align-items:center;font:14px system-ui;color:#b9cce7;left:0;width:100%;padding:6px;pointer-events:auto}#modelPicker button{font:inherit;border:1px solid #4f608a;border-radius:6px;color:#dceaff;background:#17203a;padding:7px 10px;touch-action:manipulation}#modelPicker button[aria-pressed="true"]{border-color:#9aeaff;background:#234b65;color:#fff}body.land #modelPicker{width:auto;left:50%;transform:translateX(-50%);top:4px!important}body.land #modelPicker button{padding:4px 8px;font-size:12px}#modelState{font-size:12px;max-width:85px}

<body>
<canvas id="screen" width="256" height="240"></canvas>
<div id="pad">
  <div class="btn dpad" id="bL"><svg viewBox="0 0 24 24"><path d="M16 3 L5 12 L16 21 Z" fill="currentColor"/></svg></div>
  <div class="btn dpad" id="bR"><svg viewBox="0 0 24 24"><path d="M8 3 L19 12 L8 21 Z" fill="currentColor"/></svg></div>

<script>
'use strict';
// Version label (title screen + footer). Bump on every release; see README.
const GAME_VERSION = '2.0.0-test.48';
// =====================================================================
//  ROCKSIDE  -  original run-and-gun prototype
//  All gameplay tuning lives in CONFIG. Units: pixels and frames @60Hz.
// =====================================================================
const CONFIG = {
  // ---- display ----
  viewW: 256, viewH: 240, tile: 16,

  // ---- player movement ----
  gravity: 0.25,          // px/frame^2
  maxFall: 7.0,           // terminal fall speed px/frame
  jumpVel: 5.0,           // initial jump speed -> apex ~50px (~3 tiles)
  jumpCutVel: 1.0,        // releasing jump while rising clamps upward speed to this (variable jump height)
  runSpeed: 1.5,          // px/frame
  runAccel: 0.5,          // ground accel (full speed in 3 frames)
  airAccel: 0.5,          // air accel
  stopDecel: 1.5,         // decel when no input (>= runSpeed means instant stop, no slide)
  coyoteFrames: 6,        // can still jump this many frames after leaving a ledge
  jumpBufferFrames: 6,    // jump pressed this many frames before landing still triggers

  // ---- shooting ----
  shotSpeed: 4.5,
  maxShots: 3,
  shotCooldown: 8,        // frames between shots
  shootPoseFrames: 16,    // how long the arm-cannon pose stays up
  autoFire: true,         // holding SHOT keeps firing (mobile friendly)
  autoFireInterval: 10,
  shotDamage: 1,

  // ---- player health ----
  playerMaxHP: 16,
  magicMaxMP: 20, magicOrbCost: 6, magicRegenFrames: 50, magicOrbLife: 360,
  invincFrames: 90,       // blinking mercy frames after a hit
  knockbackFrames: 18,    // frames of lost control after a hit
  knockbackSpeed: 1.0,    // px/frame pushed away while stunned
  hurtHitStop: 4,         // freeze frames on hit
  hurtShake: 3,
  killHitStop: 2,

  // ---- enemies ----
  enemy: {
    activateMargin: 40,   // px outside the camera where enemies start updating
    bulletDamage: 2,
    // hurtUp: the hurtbox (what shots/arrows hit) reaches this many px ABOVE the
    // contact box, so a standing shot on the same floor (spawns ~17px above the
    // feet) connects. Contact damage still uses the small body box (e.w x e.h).
    walker: { hp: 2, speed: 0.5, damage: 2, hurtUp: 8 },   // contact 12x12, hurtbox 12x20
    hopper: { hp: 3, jumpVel: 4.5, hopSpeed: 1.2, waitFrames: 55, damage: 3, hurtUp: 9 }, // contact 12x11, hurtbox 12x20
    flyer:  { hp: 2, speed: 0.5, bobAmp: 10, fireInterval: 130, bulletSpeed: 1.3, damage: 2, leash: 96 },
  },

  // ---- boss: 闇落ち飛梅 (Dark Tobiume) - flying boss ----
  boss: {
    hp: 20,
    iFrames: 8,             // invulnerable flash after each hit
    contactDamage: 3,
    bulletDamage: 2,        // heart / star magic bullets
    shockDamage: 3,         // floor shockwave from the dive kick
    hoverY: 150, hoverBob: 10, driftSpeed: 0.9,     // hover height (top of hitbox) / bob amplitude / side drift
    idleFrames: 55, idleFramesRage: 32,             // pause between attacks (rage = below 50% HP)
    fanCount: 5, fanSpread: 0.30, fanSpeed: 1.7, fanWindup: 26, fanVolleysRage: 2,
    swoopTelegraph: 28, swoopSpeed: 3.4, landFrames: 26,
    kickRiseY: 36, kickAimFrames: 40, kickAimSpeed: 2.2, kickSpeed: 6.5, shockSpeed: 2.0,
    recoverSpeed: 1.6,
    rescueLineFrames: 260,  // how long her thank-you line stays before STAGE CLEAR (tap skips)
  },

  // ---- DARK friend bosses (v4). All ground/float bosses share: hp, iFrames, contactDamage ----
  bosses: {
    // DARK ネーニア: keeps her distance and shoots. a) aimed arrow (leads the player)
    // b) arrow rain in marked columns  c) backstep jump + triple volley
    // v5: d) ricochet arrow (dotted bounce path, locks before release)  e) lobbed volley (floor marks trail the player)
    //     f) thorn snare (marked landing spot -> thorn patch on the floor for a while; enraged: 2 snares + a quick aimed arrow)
    neenia: { hp: 34, iFrames: 12, contactDamage: 3, arrowDamage: 2, rainDamage: 3,   // v5: 28 -> 34 HP
      keepMin: 76, keepMax: 140, walkSpeed: 0.75, idleFrames: 22, idleFramesRage: 10,
      aimFrames: 30, arrowSpeed: 3.8, leadMax: 40, aimShotsRage: 3,
      rainCols: 3, rainColsRage: 5, rainWarn: 58, rainSpeed: 4.0, rainAimAt: 30,  // + one aimed arrow while the columns are marked
      backstepVx: 2.2, backstepVy: 3.6, volleyWind: 14, volleySpread: 0.22, volleySpeed: 3.2, volleysRage: 2,
      ricoAim: 46, ricoAimRage2: 34, ricoLock: 16, ricoSpeed: 4.6, ricoBounces: 2, ricoShots: 2, ricoShotsRage: 3, ricoDamage: 2,
      lobWind: 22, lobCount: 5, lobCountRage: 6, lobEvery: 17, lobEveryRage: 12, lobAir: 46, lobGrav: 0.3, lobLead: 0, lobDamage: 2,
      snareWind: 22, snareAir: 42, snareLife: 150, snareLifeRage: 170, snareW: 26, snareDamage: 2, snareArrowDamage: 2, snareSecondGap: 46,
      counterDraw: 14, counterSpeed: 4.2, counterCooldown: 160, counterCooldownRage: 100,   // quick-draw when Umine jumps near an idle Neenia
      rescueLineFrames: 240 },
    // DARK 青天: a) cat pounce toward the player  b) cursed song: ground sound waves (+ notes when enraged)
    // c) (below 50% HP) rapid multi-leap. pounceLeaps: leaps per normal pounce (the 2nd follows the player)
    seiten: { hp: 28, iFrames: 12, contactDamage: 3, waveDamage: 2, noteDamage: 2, idleFrames: 38, idleFramesRage: 24,
      crouchFrames: 16, leapVy: 4.6, leapMaxVx: 3.2, landFrames: 20,
      inhaleFrames: 30, waveSpeed: 1.8, wavesRage: 2, noteSpeed: 2.4, notesRage: 1, pounceLeaps: 2,
      multiLeaps: 3, multiCrouch: 8, multiVy: 4.0, multiLand: 6,
      rescueLineFrames: 240 },
    // DARK リリィ: idol-princess boss. Song waves, stars, heart hop, plus Umimi moon support.
    lily: { hp: 34, iFrames: 12, contactDamage: 3, noteDamage: 2, starDamage: 2, heartDamage: 2,
      idleFrames: 44, idleFramesRage: 28, songWind: 28, starWind: 26, healTriggerHP: 10, healAmount: 5, rescueLineFrames: 240 },
    // DARK ダイスロール (dice-headed monster; the girl inside is ダイスロール, she/her). Ground walker. Dice / cards / chips / roulette:
    // fate: tosses a big die; the face shown (1-6, drawn large above her head + label) picks the follow-up and its count:
    //       1-2 roulette (1 or 2 balls), 3-4 card fan (face = number of cards), 5-6 chip rain (face-1 columns)
    // dice: 2 dice (enraged 3) bounce once and roll along the floor (jump) / cards: card fan with a guaranteed safe gap on Umine's standing spot (dotted paths + green floor mark, 24f preview)
    // boomerang: spinning cards out and back one at a time (next after the catch, height mark): low, high, low (enraged + high) / chips: marked columns, then chip stacks drop
    // roulette: the ball circles her hand, then bounces around the room for a while
    // enraged (<= 50%): flaming die (bounces, leaves embers on landing) + once: ALL IN (chips -> card fan -> dice, announced)
    // FINAL: 清掃員カナタ form 1 (half-ghost poltergeist maid + her vacuum mimic; floats just above the floor)
    // levitate: raised hand, 3 objects (enraged 4) rise around her and glow, aim lines, then thrown one by one at Umine
    // suction: wind telegraph, then the vacuum pulls Umine toward its mouth (run/jump away; the pull is weaker than running)
    //          and swallows Umine's shots in the wind cone -> spit: hose raised, ghost-bullet fan + the swallowed shots come back
    // ghosts: ghost fireballs rise to the ceiling over floor marks, then dive / glide: she floats over Umine to the other side
    kanata: { hp: 40, iFrames: 18, contactDamage: 3, floatGap: 1, idleFrames: 40, idleFramesRage: 28, recover: 30, recoverRage: 20,
      comboChance: 0.15, comboChanceRage: 0.45,
      levWind: 34, levWindRage: 26, levCount: 3, levCountRage: 4, levGap: 16, levGapRage: 12, levSpeed: 2.8, levDamage: 2,
      suckWarn: 36, suckWarnRage: 28, suckFrames: 110, suckFramesRage: 130, suckPull: 0.62, suckPullAir: 0.5, suckRange: 150, suckBite: 3,
      spitWind: 20, spitCount: 6, spitCountRage: 8, spitSpread: 0.2, spitSpeed: 2.4, spitDamage: 2, spitBackMax: 6, spitBackSpeed: 2.6,
      ghostCount: 3, ghostCountRage: 4, ghostHover: 40, ghostSpeed: 3.0, ghostDamage: 2,
      glideSpeed: 2.2, rescueLineFrames: 240 },
    // FINAL: 闇海音 DARK UMINE (after the rush, before Kanata): a mirror of Umine. shots: staff glint -> straight volley (jump) /
    // charge: dotted aim line locks chargeLock frames before the big orb (x2 when enraged) / jump: landing mark beyond Umine, gap fan
    // at the apex (stand still = safe), floor ripples on landing when enraged / umimi: dark Umimi drops water on floor marks
    darkumine: { hp: 38, iFrames: 14, contactDamage: 2, idleFrames: 36, idleFramesRage: 26, dodgeVel: 4.2, dodgeCD: 80, dodgeCDRage: 55, comboChance: 0.2, comboChanceRage: 0.45, recover: 22, keepMin: 64, keepMax: 120, walkSpeed: 0.9,
      shotWind: 24, shotGap: 20, shotCount: 3, shotCountRage: 5, shotSpeed: 3.0, summonShotGap: 34, shotDamage: 2,
      chargeWind: 56, chargeWindRage: 46, chargeWind2: 34, chargeLock: 12, chargeSpeed: 3.8, chargeDamage: 3,
      jumpWind: 18, jumpAir: 43, jumpVel: 5.4, jumpPast: 50, fanSpeed: 2.4, rippleSpeed: 1.9, rippleDamage: 2,
      dropCount: 3, dropCountRage: 4, dropGapX: 30, dropFirst: 54, dropEvery: 24, dropFall: 26, dropDamage: 2, rescueLineFrames: 240 },
    // FINAL: 暴走ミミック form 2 (the vacuum alone, berserk; Kanata's ghost floats nearby and throws objects now and then)

function playerMaxHP() { return hardMode ? Math.max(1, Math.floor(CONFIG.playerMaxHP / 2)) : CONFIG.playerMaxHP; }
function toggleHardMode() { hardMode = !hardMode; P.hp = Math.min(P.hp, playerMaxHP()); sfx('cursor'); }

// =====================================================================
//  Globals / setup
// =====================================================================
const VW = CONFIG.viewW, VH = CONFIG.viewH, TS = CONFIG.tile;
const ROWS = 15, SCREEN_COLS = 16;
const T_EMPTY = 0, T_ROCK = 1, T_GIRDER = 2, T_DOOR = 3;
// ---- current stage (rebuilt by loadMap when an area is chosen on the stage select) ----
let MAP = [], COLS = 0, LEVEL_W = 0, grid = new Uint8Array(0), ROOM_X = 0;
const spawns = [];     // enemies {type,c,r}
const allySpawns = []; // allies {type,c,r}
let START_C = 2, START_R = 12, CP_C = 0, CP_R = 12, ROOM_COL = 0, BOSS_C = 0, BOSS_R = 12;
const DOOR_ROWS = [];
function loadMap(screens) {
  for (let s = 0; s < screens.length; s++) {
    if (screens[s].length !== ROWS) throw new Error('Screen ' + s + ' has ' + screens[s].length + ' rows');
    for (let r = 0; r < ROWS; r++) if (screens[s][r].length !== SCREEN_COLS) throw new Error('Screen ' + s + ' row ' + r + ' bad width');
  }
  MAP = [];
  for (let r = 0; r < ROWS; r++) { let row = ''; for (let s = 0; s < screens.length; s++) row += screens[s][r]; MAP.push(row); }
  COLS = MAP[0].length; LEVEL_W = COLS * TS; grid = new Uint8Array(COLS * ROWS);
  spawns.length = 0; allySpawns.length = 0; DOOR_ROWS.length = 0;
  START_C = 2; START_R = 12; CP_C = 0; CP_R = 12; ROOM_COL = 0; BOSS_C = 0; BOSS_R = 12;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = MAP[r][c]; let t = T_EMPTY;
    if (ch === '#') t = T_ROCK; else if (ch === '=') t = T_GIRDER;
    else if (ch === 'D') { t = T_DOOR; ROOM_COL = c; DOOR_ROWS.push(r); }
    else if (ch === 'P') { START_C = c; START_R = r; }
    else if (ch === 'C') { CP_C = c; CP_R = r; }
    else if (ch === 'B') { BOSS_C = c; BOSS_R = r; }

// =====================================================================
//  AREA 5  災厄の紅月城 DISASTER CASTLE - boss 魔王ディザスター (Demon Lord Disaster)
//  He is the dark-fallen form of スターさん (Star, he/him). His 錬金剣 (alchemy sword) changes shape
//  for every attack. Fairness rules for every form:
//    1. purple MORPH flash on his body + the next weapon's icon above his head (DISASTER_MORPH frames)
//    2. the weapon's own telegraph (aim line / floor mark / reach line / wind-up)
//    3. the strike, then a recovery window (best time to shoot him)
//  Forms (bossSeen names): sword, spear, axe, scythe (returns), bow, whip (whip-sword), lance (cannon-spear).
//  Tuning: CONFIG.bosses.disaster.
//  Enraged (<= 50% HP, or hard mode): shorter morphs/wind-ups and sometimes a 2nd form chained right after.
//
//  ART (assets/disaster_dark.json): every form has its own body frame with the weapon baked in (pose = form name,
//  'transform' during the morph). Muzzle points below are in the RIGHT-facing 48x48 frame (body x=23); mirrored
//  when he faces left. assets/alchemic_weapons.png icons (sword..whip, lance = cell 6) are shown above his head
//  during the morph, and replace the weapon if the body sheet is missing. Without any sheet the code-drawn
//  shapes (drawWeaponShape) are used. Projectiles use assets/disaster_bullets.png (b.dspr) when it is loaded.
// =====================================================================
const DISASTER_FORMS = ['sword', 'spear', 'axe', 'scythe', 'bow', 'whip', 'lance'];
//  icon: cell in alchemic_weapons.png (-1 = none), grip: gripNorm from alchemic_weapons.json, muz: muzzle in the body frame
const DISASTER_WEAPONS = {
  sword:  { icon: 0, grip: [0.266, 0.766], muz: [46, 27] },
  spear:  { icon: 1, grip: [0.297, 0.766], muz: [46, 23] },
  axe:    { icon: 2, grip: [0.234, 0.734], muz: [40, 30] },
  scythe: { icon: 3, grip: [0.266, 0.734], muz: [46, 27] },
  bow:    { icon: 4, grip: [0.609, 0.547], muz: [46, 22] },
  whip:   { icon: 5, grip: [0.734, 0.359], muz: [46, 20] },
  lance:  { icon: 6, grip: [0.359, 0.734], muz: [46, 24] },   // cannon-spear (alchemic_weapons.png cell 6, added 2026-10-03)
};
const DIS_SPR = { wave: 0, spear: 1, burst: 2, arrow: 3, scythe: 4, orb: 5 };   // disaster_bullets.png cells
// world position of a weapon's muzzle (falls back to an estimate when the sheet is not loaded)
function disasterMuzzle(b, form) {
  const W = DISASTER_WEAPONS[form] || DISASTER_WEAPONS.sword, D = SHEET_DEFS.disasterDark;
  return { x: b.x + b.w / 2 + b.face * (W.muz[0] - D.cx), y: b.y + b.h + b.hopY - D.fh + W.muz[1] };
}
function disasterHand(b) { return disasterMuzzle(b, b.weapon || 'sword'); }
function disasterArt() { return !!SHEETS.disasterDark && SHEETS.disasterDark.length >= 14; }
function disShot(x, y, vx, vy, kind, dmg, spr) { const q = spawnBullet(x, y, vx, vy, kind, dmg); if (q && SHEETS.disasterBullets) q.dspr = spr; return q; }
// cannon orb hits the floor: two small ground shocks (jump them)
function disasterOrbBurst(q) {
  const B = CONFIG.bosses.disaster, c = q.x + q.w / 2;
  if (q.y + q.h < FLOOR_Y - 20) return;
  shake(4, 1); sfx('boomS');
  disShot(c - 12, FLOOR_Y - 11, -B.orbShockSpeed, 0, 4, B.orbShockDamage, DIS_SPR.burst);
  disShot(c + 4, FLOOR_Y - 11, B.orbShockSpeed, 0, 4, B.orbShockDamage, DIS_SPR.burst);
}

// ---- AI ----
function disasterPick(b, dist) {
  const pool = dist < 60 ? ['sword', 'axe', 'whip', 'scythe', 'lance'] : dist > 120 ? ['bow', 'spear', 'axe', 'scythe', 'lance'] : DISASTER_FORMS;
  const unseen = pool.filter(k => !b.seen.includes(k) && k !== b.last);
  return unseen.length && Math.random() < 0.6 ? pickPattern([unseen[(Math.random() * unseen.length) | 0]]) : pickPattern(pool);
}
function disasterMorph(b, form) { b.nextWeapon = form; b.rep = 0; bossSet('disMorph'); bossFacePlayer(); sfx('warn'); }
function disasterRecover(b, B) { b.recT = bossRage() ? B.recoverRage : B.recover; b.aimShow = false; bossSet('disRecover'); }
const DIS_STATE = { sword: 'disSword', spear: 'disSpear', axe: 'disAxe', scythe: 'disScythe', bow: 'disBow', whip: 'disWhip', lance: 'disLance' };

function aiDisaster(b, B, pcx, pcy) {
  const rage = bossRage(), cx = b.x + b.w / 2, dx = pcx - cx, dist = Math.abs(dx);
  const floatY = FLOOR_Y - b.h - B.floatGap;
  if (b.state === 'hover') {
    astarteFloat(b, B); bossFacePlayer();
    const ideal = 84, sp = rage ? 1.0 : 0.75;
    if (dist > ideal + 14) b.x += Math.sign(dx) * sp; else if (dist < ideal - 18 && dist > 2) b.x -= Math.sign(dx) * sp * 0.8;
    b.pose = dist > ideal + 14 ? 'glide' : 'idle'; b.poseF = -1;
    if (b.t >= (rage ? B.idleFramesRage : B.idleFrames)) {
      b.comboLeft = Math.random() < (rage ? B.comboChanceRage : B.comboChance) ? 1 : 0; b.rep = 0;
      disasterMorph(b, disasterPick(b, dist));
    }
    return;
  }
  if (b.state === 'disMorph') { // transform pose + purple flash: particles pull into his hand, next weapon icon above his head
    astarteFloat(b, B); b.pose = 'transform'; b.poseF = 0;
    const hd = disasterMuzzle(b, 'spear');
    if (b.t % 3 === 0) { const h = hash(b.t, 17), a = (h % 628) / 100; spawnPart(hd.x + Math.cos(a) * 20, hd.y + Math.sin(a) * 20, -Math.cos(a) * 1.4, -Math.sin(a) * 1.4, 14, 4, (h >> 9) & 1 ? '#b060ff' : '#ff4c9a'); }
    if (b.t >= (rage ? B.morphFramesRage : B.morphFrames)) {
      b.weapon = b.nextWeapon; sfx('cp');
      for (let i = 0; i < 8; i++) spawnPart(hd.x, hd.y, DIR8X[i] * 1.3, DIR8Y[i] * 1.3, 14, 0, i & 1 ? '#d8a8ff' : '#ffffff');
      bossFacePlayer(); b.warn = 0;
      bossSet(DIS_STATE[b.weapon] || 'disSword');
    }
    return;
  }
  if (b.state === 'disSword') { // low crescent along the floor (jump it); enraged: then a HIGH one (stay on the ground)
    astarteFloat(b, B); b.pose = 'sword'; b.poseF = 0;
    const wind = rage ? B.swordWindRage : B.swordWind, sp = rage ? B.waveSpeedRage : B.waveSpeed, hd = disasterMuzzle(b, 'sword');
    if (b.t === wind) { disShot(hd.x - 6, FLOOR_Y - 20, b.face * sp, 0, 9, B.waveDamage, DIS_SPR.wave); sfx('swoosh'); b.fireT = 10; }
    if (rage && b.t === wind + B.swordGap) { disShot(hd.x - 6, FLOOR_Y - 47, b.face * sp, 0, 9, B.waveDamage, DIS_SPR.wave); sfx('swoosh'); b.fireT = 10; }
    if (b.t >= wind + (rage ? B.swordGap + 12 : 14)) disasterRecover(b, B);
    return;
  }
  if (b.state === 'disSpear') { // aim line tracks Umine, locks (stops moving) for spearLock frames, then the spear bolt flies
    astarteFloat(b, B); b.pose = 'spear'; b.poseF = 0;
    const aim = rage ? B.spearAimRage : B.spearAim;
    if (b.t < aim - B.spearLock) { bossFacePlayer(); b.aimX = pcx; b.aimY = pcy; }
    const hd = disasterMuzzle(b, 'spear'); b.mx = hd.x; b.my = hd.y;
    b.aimShow = b.t < aim;
    if (b.t === aim - B.spearLock) sfx('tick');
    if (b.t === aim) {
      const ax = b.aimX - hd.x, ay = b.aimY - hd.y, len = Math.hypot(ax, ay) || 1;
      disShot(hd.x - 6, hd.y - 2, ax / len * B.spearSpeed, ay / len * B.spearSpeed, 21, B.spearDamage, DIS_SPR.spear);
      b.x -= b.face * 6; sfx('bshoot'); b.fireT = 10; b.aimShow = false;
    }
    if (b.t >= aim + 18) {
      if (rage && !b.rep) { b.rep = 1; b.t = B.spearLock + 6; } // enraged: a quicker second throw (re-aims, then locks again)
      else disasterRecover(b, B);
    }
    return;
  }
  if (b.state === 'disAxe') { // rises, a floor mark locks on Umine, he slams down there: 2 floor shockwaves
    b.pose = b.t < B.axeRise ? 'glide' : 'axe'; b.poseF = b.t < B.axeRise ? -1 : 0;
    const hang = rage ? B.axeHangRage : B.axeHang, topY = floatY - 74;
    if (b.t <= B.axeRise) { b.y += (topY - b.y) * 0.16; b.x += Math.sign(dx) * Math.min(1.6, dist); b.warnX = Math.max(ROOM_L + 14, Math.min(ROOM_R - 14, pcx)); b.warn = 1; }
    else if (b.t <= B.axeRise + hang) { const tx = b.warnX - b.w / 2; b.x += Math.sign(tx - b.x) * Math.min(3, Math.abs(tx - b.x)); }
    else {
      b.y += B.axeDrop;
      if (b.y >= floatY) {
        b.y = floatY; b.warn = 0; shake(10, 2); sfx('boomS'); bossDust(b, 8);
        const sp = rage ? B.axeWaveSpeedRage : B.axeWaveSpeed, c = b.x + b.w / 2;
        disShot(c - 12, FLOOR_Y - 11, -sp, 0, 4, B.axeDamage, DIS_SPR.burst); disShot(c + 4, FLOOR_Y - 11, sp, 0, 4, B.axeDamage, DIS_SPR.burst);
        if (rage && !b.rep) { b.rep = 1; b.t = 6; } // enraged: leaps again for a second marked slam
        else { disasterRecover(b, B); b.recT += 12; }
      }
    }
    return;
  }
  if (b.state === 'disScythe') { // one low jumpable crescent that turns around and comes back (sooner when enraged)
    astarteFloat(b, B); b.pose = 'scythe'; b.poseF = 0;
    const wind = rage ? B.scytheWind - 5 : B.scytheWind, hd = disasterMuzzle(b, 'scythe');
    if (b.t === wind) {
      const q = disShot(hd.x - 6, FLOOR_Y - 20, b.face * (rage ? B.waveSpeedRage : B.waveSpeed), 0, 9, B.waveDamage, DIS_SPR.scythe);
      if (q) q.ret = rage ? B.scytheReturn - 16 : B.scytheReturn;
      sfx('swoosh'); b.fireT = 10;
    }
    if (b.t >= wind + 16) disasterRecover(b, B);
    return;
  }
  if (b.state === 'disBow') { // backstep, draw, then a spread aimed at Umine: 2 arrows leave a safe gap, enraged 3 do not
    astarteFloat(b, B); b.pose = b.t < B.bowStep ? 'glide' : 'bow'; b.poseF = b.t < B.bowStep ? -1 : 0;
    if (b.t < B.bowStep) { b.x -= Math.sign(dx || 1) * 1.6; }
    else bossFacePlayer();
    if (b.t === B.bowStep + B.bowWind) {
      const hd = disasterMuzzle(b, 'bow'), ang = Math.atan2(pcy - hd.y, pcx - hd.x);
      for (const sp of (rage ? [-0.26, 0, 0.26] : [-0.17, 0.17])) disShot(hd.x - 4, hd.y - 2, Math.cos(ang + sp) * B.bowSpeed, Math.sin(ang + sp) * B.bowSpeed, 6, B.arrowDamage, DIS_SPR.arrow);
      sfx('arrow'); b.fireT = 10;
    }
    if (b.t >= B.bowStep + B.bowWind + 14) disasterRecover(b, B);
    return;
  }
  if (b.state === 'disWhip') { // whip-sword: dotted reach line on the floor, then a low segmented lash out and back (jump it or stay out of reach)
    astarteFloat(b, B); b.pose = 'whip'; b.poseF = 0;
    const warn = rage ? B.whipWarnRage : B.whipWarn, x0 = disasterMuzzle(b, 'whip').x;
    if (b.t === 1) b.chainReach = rage ? B.whipReachRage : B.whipReach;
    const k = b.t - warn, len = k < 0 ? 0 : k < 10 ? b.chainReach * k / 10 : k < 18 ? b.chainReach : b.chainReach * Math.max(0, 26 - k) / 8;
    if (k === 0) { b.chainB = spawnBullet(x0, FLOOR_Y - 12, 0, 0, 22, B.whipDamage); sfx('swoosh'); }
    if (b.chainB && b.chainB.active && b.chainB.kind === 22) {
      const q = b.chainB, x1 = Math.max(ROOM_L, Math.min(ROOM_R, x0 + b.face * len));
      q.x = Math.min(x0, x1); q.w = Math.max(2, Math.abs(x1 - x0)); q.y = FLOOR_Y - 12; q.h = 8; q.face = b.face;
      if (k >= 26) { q.active = false; b.chainB = null; }
    }
    if (k >= 30) disasterRecover(b, B);
    return;
  }
  if (b.state === 'disLance') { // cannon-spear: charge glow at the muzzle, aim locks, then an orb that bursts into 2 ground shocks
    astarteFloat(b, B); b.pose = 'lance'; b.poseF = 0;
    const ch = rage ? B.lanceChargeRage : B.lanceCharge;
    if (b.t < ch - B.lanceLock) { bossFacePlayer(); b.aimX = pcx; b.aimY = Math.max(pcy, FLOOR_Y - 40); }
    const hd = disasterMuzzle(b, 'lance'); b.mx = hd.x; b.my = hd.y;
    b.aimShow = b.t >= ch - B.lanceLock && b.t < ch;
    if (b.t === ch - B.lanceLock) sfx('tick');
    if (b.t < ch && b.t % 4 === 0) { const h = hash(b.t, 23), a = (h % 628) / 100; spawnPart(hd.x + Math.cos(a) * 12, hd.y + Math.sin(a) * 12, -Math.cos(a) * 0.9, -Math.sin(a) * 0.9, 12, 4, (h >> 9) & 1 ? '#b060ff' : '#ff4c9a'); }
    if (b.t === ch) {
      const base = Math.atan2(b.aimY - hd.y, b.aimX - hd.x);
      for (const sp of (rage ? [-0.2, 0, 0.2] : [0])) disShot(hd.x - 3, hd.y - 3, Math.cos(base + sp) * B.lanceSpeed, Math.sin(base + sp) * B.lanceSpeed, 23, B.orbDamage, DIS_SPR.orb);
      b.x -= b.face * 8; shake(6, 1); sfx('bshoot'); b.fireT = 10; b.aimShow = false;
    }
    if (b.t >= ch + 20) disasterRecover(b, B);
    return;
  }
  if (b.state === 'disRecover') {
    astarteFloat(b, B); b.pose = b.t < 10 && b.weapon ? b.weapon : 'idle'; b.poseF = b.t < 10 ? 0 : -1;
    if (b.t >= b.recT) {
      if (b.comboLeft > 0) { b.comboLeft--; disasterMorph(b, disasterPick(b, dist)); }
      else bossSet('hover');
    }
    return;
  }
  bossSet('hover'); // unknown state (e.g. after the intro)
}

// ---- drawing: weapon icons, morph FX, telegraphs, projectiles ----
// code-drawn alchemy weapons (fallback without art), pointing right from the hand at (0,0). col = main, hi = highlight.
function drawWeaponShape(k, col, hi) {
  const F = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  if (k === 'sword') { F(-3, -1, 4, 3, '#3a1030'); F(1, -3, 2, 7, col); F(3, -1, 20, 3, col); F(23, 0, 3, 1, col); F(4, 0, 18, 1, hi); }
  else if (k === 'spear') { F(-8, 0, 30, 1, '#5a2040'); F(-8, -1, 30, 1, col); F(22, -3, 3, 7, col); F(25, -2, 3, 5, col); F(28, -1, 3, 3, hi); }
  else if (k === 'axe') { F(-4, 0, 22, 2, '#5a2040'); F(14, -9, 4, 20, col); F(18, -8, 3, 18, col); F(21, -6, 2, 14, hi); }
  else if (k === 'scythe') { F(-4, 0, 22, 2, '#5a2040'); F(16, -12, 3, 14, col); for (let i = 0; i < 9; i++) F(16 - i * 2, -12 - Math.round(Math.sin(i / 8 * Math.PI) * 4), 3, 2, i & 1 ? hi : col); }
  else if (k === 'bow') { for (let i = -10; i <= 10; i++) F(4 + Math.round((1 - (i * i) / 100) * 6), i, 2, 1, col); F(4, -10, 1, 21, hi); F(-2, 0, 14, 1, hi); }
  else if (k === 'lance') { F(-6, -1, 14, 3, '#5a2040'); F(6, -4, 6, 9, col); F(12, -3, 10, 7, col); F(22, -2, 6, 5, col); F(28, -1, 3, 3, hi); F(13, -1, 12, 1, hi); }
  else { F(-3, -1, 4, 3, '#3a1030'); for (let i = 0; i < 4; i++) F(2 + i * 5, -1 + (i & 1), 4, 2, i & 1 ? hi : col); F(22, -2, 4, 4, col); }   // whip-sword
}
// alchemic_weapons.png icon with its grip at (hx, hy) (gripNorm per weapon); code shape when there is no icon
function drawDisasterWeapon(k, hx, hy, face, size, col, hi) {
  const W = DISASTER_WEAPONS[k] || DISASTER_WEAPONS.sword, S = SHEETS.alchemicWeapons;
  g.save(); g.translate(Math.round(hx), Math.round(hy)); if (face < 0) g.scale(-1, 1); g.imageSmoothingEnabled = false;
  if (S && W.icon >= 0 && S[W.icon]) g.drawImage(S[W.icon].r, Math.round(-size * W.grip[0]), Math.round(-size * W.grip[1]), size, size);
  else drawWeaponShape(k, col || '#ff376c', hi || '#ffd0dc');
  g.restore();
}
function drawDisasterWeaponLayer(b, mx, by) {
  const st = b.state;
  if (st === 'disMorph') {
    const M = bossRage() ? CONFIG.bosses.disaster.morphFramesRage : CONFIG.bosses.disaster.morphFrames;
    // transform_fx flash at the raised hand (frame 4 of the body sheet)
    const hx = mx + b.face * (DISASTER_WEAPONS.spear.muz[0] - 23 - 8), hy = by - 48 + 16;
    if (SHEETS.transformFx) { const fi = Math.min(3, (b.t * 4 / M) | 0); g.drawImage(pick(SHEETS.transformFx[fi], b.face, false), hx - 12, hy - 12); }
    else { g.save(); g.globalAlpha = 0.25 + 0.15 * ((b.t >> 2) & 1); g.fillStyle = '#9a40ff'; g.beginPath(); g.arc(hx, hy, 14 - (b.t % 10), 0, Math.PI * 2); g.fill(); g.restore(); }
    // next weapon icon above his head (blinks): tells which attack comes

    if ((b.t >> 2) & 1 || b.t > M - 8) {

function drawDisasterMarks(b, camX, blink) {

// disaster_bullets.png sprite (cells face right, centre 12,12)
function drawDisasterBulletSprite(q, camX) {
  const S = SHEETS.disasterBullets, i = q.dspr, cx = Math.round(q.x + q.w / 2 - camX), cy = Math.round(q.y + q.h / 2), f = q.vx < 0 ? -1 : 1;

// fallback drawing (no bullet sheet) + the whip lash (always code-drawn: its length changes every frame)
function drawDisasterBullet(q, x, y) {

// ---- rescued スターさん as support: ALCHEMY MORPH SLASH (HELP button "MORPH") ----

function starHitAhead(range, dmgE, dmgB) {

    if (!e.alive || !e.active || e.x + e.w < cam.x || e.x > cam.x + VW) continue;

    if (ahead > -10 && ahead < range) { e.hp -= dmgE; e.flash = 10; spawnPart(ex, e.y + 4, f * 0.6, -0.5, 14, 0, '#72eaff'); if (e.hp <= 0) killEnemy(e); }
  }

}
function updateStarSupport(t) {
  support.x += (P.x + P.w / 2 - P.face * 20 - support.x) * 0.25; support.y += (P.y - support.y) * 0.25;
  if (t < 30) support.face = P.face;

}
function drawStarSupport(t, x, y, camX) {
  const fr = SHEETS.starNormal, d = SHEET_DEFS.starNormal, f = support.face;

  else { g.fillStyle = '#3a6ad8'; g.fillRect(x - 6, y - 8, 12, 28); }

    g.restore();
  }
  if (t >= 18 && t < 27 && sw) { // star_weapon.png cyan slash arc, 2x, in front of him
    g.save(); g.translate(hx + f * 14, hy - 4); if (f < 0) g.scale(-1, 1); g.imageSmoothingEnabled = false;
    g.globalAlpha = t < 24 ? 1 : (27 - t) / 3; g.drawImage(sw[1].r, -32, -32, 64, 64); g.restore();
  } else if (t >= 18 && t < 27) { g.strokeStyle = t & 2 ? '#e8fbff' : '#5ad8ff'; g.lineWidth = 3; g.beginPath(); g.arc(hx, hy, Math.min(60, (t - 16) * 9), f > 0 ? -1.1 : Math.PI - 0.6, f > 0 ? 0.6 : Math.PI + 1.1); g.stroke(); }
  if (t >= 30 && t < 44) { g.save(); g.globalAlpha = 0.35; g.fillStyle = (t >> 1) & 1 ? '#9a40ff' : '#5ad8ff'; g.beginPath(); g.arc(hx, hy, 16 - (t - 30), 0, Math.PI * 2); g.fill(); g.restore(); }
  if (t >= 44 && t < 56) { const w = f > 0 ? VW - hx : hx; g.fillStyle = t & 2 ? '#e8fbff' : '#5ad8ff'; g.fillRect(f > 0 ? hx : 0, hy - 2, w, 4); g.fillStyle = '#ffffff'; g.fillRect(f > 0 ? hx : 0, hy - 1, w, 1); }
}

// =====================================================================
//  AREA 7  狐火の社 FOXFIRE SHRINE - boss DARK シラヌイ (Shiranui, an oiran-style fox lady who speaks
//  archaic "noja" Japanese: わらわ / おぬし / 〜のじゃ). Floats; every attack starts from a readable pose
//  (fan raised = sprite frame 4, with a glow above her head in the attack's colour), then the attack's own telegraph:
//    volley    3 aimed foxfires (enraged 5) that home a little right after the throw
//    wisp      purple will-o-wisps orbit her first, then drift at Umine one by one (slow homing)
//    crescent  flame crescent along the floor (jump it); enraged: a second, faster one
//    fan       spinning fan boomerang: out LOW (jump it), back HIGH over Umine's head (enraged: back low too)
//    pillar    ember marks on the floor (Umine's spot + 1 more, enraged +2), then fire pillars erupt there
//    illusion  vanishes (blinking illusion frame), reappears blinking with 2 clones; shoot a clone to pop it;
//              everyone left throws a foxfire (enraged: 2 each)
//  Tuning: CONFIG.bosses.shiranui. Art: assets/shiranui_dark.png (+ .json), shiranui_bullets.png, shiranui_bullets_pillar.png.
// =====================================================================
const SHIRANUI_PATS = ['volley', 'wisp', 'crescent', 'fan', 'pillar', 'illusion'];
const SH_STATE = { volley: 'shVolley', wisp: 'shWisp', crescent: 'shCrescent', fan: 'shFan', pillar: 'shPillar', illusion: 'shIllusion' };
const SH_GLOW = { shVolley: '#ffa040', shCrescent: '#ff4030', shFan: '#c02040', shPillar: '#ffd060', shWisp: '#b070ff' };
// fan tip (frame 5) in world space
function shiranuiTip(b) { const D = SHEET_DEFS.shiranuiDark; return { x: b.x + b.w / 2 + b.face * (D.muzX - D.cx), y: b.y + b.h + b.hopY - D.fh + D.muzY }; }
function shiranuiPick(b) {
  const unseen = SHIRANUI_PATS.filter(k => !b.seen.includes(k) && k !== b.last);
  return unseen.length && Math.random() < 0.6 ? pickPattern([unseen[(Math.random() * unseen.length) | 0]]) : pickPattern(SHIRANUI_PATS);
}
function shiranuiRecover(b, B) { b.recT = bossRage() ? B.recoverRage : B.recover; b.blink = false; bossSet('shRecover'); }
function shiranuiStart(b, pat) { bossFacePlayer(); sfx('warn'); bossSet(SH_STATE[pat]); }

// ---- per-bullet hooks (run first in updateBullets; return true = bullet finished this frame) ----
function shSteer(q, tx, ty, speed, turn) {
  const a = Math.atan2(q.vy, q.vx), want = Math.atan2(ty - (q.y + q.h / 2), tx - (q.x + q.w / 2));

  const na = a + Math.max(-turn, Math.min(turn, d)); q.vx = Math.cos(na) * speed; q.vy = Math.sin(na) * speed;
}
function shHomeHook(q) { if (q.t <= q.homeT && !P.dead) shSteer(q, P.x + P.w / 2, P.y + P.h / 2, q.spd, q.turn); return false; }
function shWispHook(q) {
  if (!q.rel) {
    if (boss.state !== 'shWisp') { q.rel = true; q.t = 0; const a = Math.atan2(P.y - q.y, P.x - q.x); q.vx = Math.cos(a) * q.spd; q.vy = Math.sin(a) * q.spd; return false; }
    q.ang += 0.09; q.rad = Math.min(q.rad + 1.2, 26);
    q.x = boss.x + boss.w / 2 + Math.cos(q.ang) * q.rad - q.w / 2; q.y = boss.y + boss.h / 2 - 6 + Math.sin(q.ang) * q.rad * 0.8 - q.h / 2; q.vx = 0; q.vy = 0;
    return false;
  }
  return shHomeHook(q);
}
function shFanHook(q) {
  const B = CONFIG.bosses.shiranui;
  if (!q.back) {
    q.vx -= q.f * B.fanDecel;
    if ((q.f > 0 && q.x + q.w > ROOM_R - 2) || (q.f < 0 && q.x < ROOM_L + 2)) q.vx = -q.f * Math.abs(q.vx) * 0.5;
    if (Math.sign(q.vx) !== q.f) { q.back = true; sfx('swoosh'); }
  } else {
    q.vx = -q.f * Math.min(B.fanSpeed, Math.abs(q.vx) + B.fanDecel);
    q.y += (q.backY - q.y) * 0.12;
    const bc = boss.x + boss.w / 2;
    if ((q.x + q.w / 2 - bc) * q.f <= 0 || q.t > 260 || boss.state === 'rescue') { q.active = false; return true; } // caught
  }
  return false;
}
function shSpawn(x, y, vx, vy, kind, dmg, spr) { const q = spawnBullet(x, y, vx, vy, kind, dmg); if (q) q.sspr = spr; return q; }
function shFoxfire(x, y, ang, B, speed, home) {
  const q = shSpawn(x - 4, y - 4, Math.cos(ang) * speed, Math.sin(ang) * speed, 24, B.foxDamage, 0);
  if (q && home) { q.hook = shHomeHook; q.homeT = home; q.spd = speed; q.turn = B.foxTurn; }
  return q;
}

// ---- AI ----
function aiShiranui(b, B, pcx, pcy) {
  const rage = bossRage(), cx = b.x + b.w / 2, dx = pcx - cx, dist = Math.abs(dx);
  if (b.state === 'hover') {
    astarteFloat(b, B); bossFacePlayer(); b.blink = false;
    const ideal = 92, sp = rage ? 1.0 : 0.8;
    if (dist > ideal + 14) b.x += Math.sign(dx) * sp; else if (dist < ideal - 20 && dist > 2) b.x -= Math.sign(dx) * sp;
    b.x = Math.max(ROOM_L + 4, Math.min(ROOM_R - b.w - 4, b.x));
    b.pose = Math.abs(dist - ideal) > 16 ? 'glide' : 'idle'; b.poseF = -1;
    if (b.t >= (rage ? B.idleFramesRage : B.idleFrames)) { b.comboLeft = Math.random() < (rage ? B.comboChanceRage : B.comboChance) ? 1 : 0; shiranuiStart(b, shiranuiPick(b)); }
    return;
  }
  if (b.state === 'shVolley') { // fan raised (glow) -> throws N foxfires at Umine, each homes briefly
    astarteFloat(b, B);
    const wind = rage ? B.volleyWindRage : B.volleyWind, n = rage ? B.volleyCountRage : B.volleyCount;
    b.pose = 'attack'; b.poseF = b.t < wind ? 0 : 1;
    if (b.t < wind) bossFacePlayer();
    const k = b.t - wind;
    if (k >= 0 && k % B.volleyGap === 0 && k / B.volleyGap < n) {
      const tp = shiranuiTip(b), i = k / B.volleyGap, a = Math.atan2(pcy - tp.y, pcx - tp.x) + (i - (n - 1) / 2) * 0.22;
      shFoxfire(tp.x, tp.y, a, B, B.foxSpeed, B.foxHome); sfx('bshoot'); b.fireT = 8;
    }
    if (k >= n * B.volleyGap + 14) shiranuiRecover(b, B);
    return;
  }
  if (b.state === 'shWisp') { // wisps gather and orbit her, then drift at Umine one by one
    astarteFloat(b, B); bossFacePlayer(); b.pose = 'idle'; b.poseF = 1;
    const n = rage ? B.wispCountRage : B.wispCount, gap = rage ? B.wispGapRage : B.wispGap;
    if (b.t === 1) {
      b.wisps.length = 0;
      for (let i = 0; i < n; i++) { const q = shSpawn(cx, b.y + b.h / 2, 0, 0, 25, B.wispDamage, 2); if (q) { q.hook = shWispHook; q.ang = i * Math.PI * 2 / n; q.rad = 0; q.rel = false; q.spd = B.wispSpeed; q.homeT = B.wispHome; q.turn = B.wispTurn; b.wisps.push(q); } }
      sfx('cp');
    }
    const k = b.t - B.wispOrbit;
    if (k >= 0 && k % gap === 0) {
      const i = k / gap, q = b.wisps[i];
      if (q && q.active && q.kind === 25 && !q.rel) { q.rel = true; q.t = 0; const a = Math.atan2(pcy - q.y, pcx - q.x); q.vx = Math.cos(a) * q.spd; q.vy = Math.sin(a) * q.spd; sfx('arrow'); }
      if (i >= n - 1) { b.wisps.length = 0; shiranuiRecover(b, B); }
    }
    return;
  }
  if (b.state === 'shCrescent') { // flame crescent along the floor (jump); enraged: a second faster one
    astarteFloat(b, B);
    const wind = rage ? B.crescentWindRage : B.crescentWind, sp = rage ? B.crescentSpeedRage : B.crescentSpeed;
    b.pose = 'attack'; b.poseF = b.t < wind || (rage && b.t >= wind + 10 && b.t < wind + B.crescentGap) ? 0 : 1;
    if (b.t < wind) bossFacePlayer();
    const tp = shiranuiTip(b);
    if (b.t === wind) { shSpawn(tp.x - 6, FLOOR_Y - 20, b.face * sp, 0, 9, B.crescentDamage, 3); sfx('swoosh'); b.fireT = 10; }
    if (rage && b.t === wind + B.crescentGap) { shSpawn(tp.x - 6, FLOOR_Y - 20, b.face * (sp + 0.5), 0, 9, B.crescentDamage, 3); sfx('swoosh'); b.fireT = 10; }
    if (b.t >= wind + (rage ? B.crescentGap + 14 : 16)) shiranuiRecover(b, B);
    return;
  }
  if (b.state === 'shFan') { // spinning fan boomerang: out low (jump), back high (enraged: back low too)
    astarteFloat(b, B);
    const wind = rage ? B.fanWindRage : B.fanWind;
    b.pose = 'attack'; b.poseF = b.t < wind ? 0 : 1;
    if (b.t < wind) bossFacePlayer();
    if (b.t === wind) {
      const tp = shiranuiTip(b), q = shSpawn(tp.x - 7, FLOOR_Y - 16, b.face * B.fanSpeed, 0, 27, B.fanDamage, 4);
      if (q) { q.hook = shFanHook; q.f = b.face; q.back = false; q.backY = rage ? FLOOR_Y - 16 : FLOOR_Y - 48; b.fanB = q; }
      sfx('swoosh'); b.fireT = 10;
    }
    if (b.t > wind) { b.pose = 'idle'; b.poseF = -1; }
    if (b.t > wind + 10 && (!b.fanB || !b.fanB.active || b.fanB.kind !== 27 || b.t > wind + 240)) { b.fanB = null; shiranuiRecover(b, B); }
    return;
  }
  if (b.state === 'shPillar') { // ember marks on the floor, then fire pillars erupt there
    astarteFloat(b, B);
    const warn = rage ? B.pillarWarnRage : B.pillarWarn, n = rage ? B.pillarCountRage : B.pillarCount;
    b.pose = 'attack'; b.poseF = b.t < warn ? 0 : 1;
    if (b.t === 1) {
      const clamp = x => Math.max(ROOM_L + 10, Math.min(ROOM_R - 10, x)), side = Math.random() < 0.5 ? -1 : 1;
      b.pillars = [clamp(pcx)];
      if (n >= 2) b.pillars.push(clamp(pcx + side * B.pillarGap));
      if (n >= 3) b.pillars.push(clamp(pcx - side * B.pillarGap));
      sfx('tick');
    }
    if (b.t === warn) {
      for (const x of b.pillars) { const q = shSpawn(x - 6, FLOOR_Y - 38, 0, 0, 28, B.pillarDamage, -1); if (q) q.life = B.pillarLife; }

    return;
  }
  if (b.state === 'shIllusion') { // vanish -> hidden -> reappear blinking with 2 clones -> everyone throws a foxfire
    const V = B.illusionVanish, H = V + B.illusionHidden, blinkT = rage ? B.illusionBlinkRage : B.illusionBlink, A = H + blinkT;
    astarteFloat(b, B); b.pose = 'vanish'; b.poseF = 0;

    else if (b.t === V) { b.hidden = true; b.blink = false; }

      // never right on top of Umine: push slots away from her

      b.x = Math.max(ROOM_L + 2, Math.min(ROOM_R - b.w - 2, slots[real] - b.w / 2));

      b.hidden = false; b.blink = true; bossFacePlayer(); sfx('swoosh');
      for (const s of [{ x: b.x }, ...b.clones]) for (let i = 0; i < 6; i++) spawnPart(s.x + b.w / 2, b.y + b.h / 2, DIR8X[i] * 1.2, DIR8Y[i] * 1.2, 16, 0, i & 1 ? '#b070ff' : '#ff6a4a');
    } else if (b.t > H && b.t < A) {
      bossFacePlayer();
      for (const c of b.clones) { // a water shot pops a clone
        if (!c.alive) continue;
        const box = { x: c.x, y: b.y, w: b.w, h: b.h };
        for (const s of shots) if (s.active && overlap(s, box)) { s.active = false; c.alive = false; popAt(c.x + b.w / 2, b.y + b.h / 2, '#b070ff'); sfx('pop'); break; }
      }
    } else if (b.t === A) {
      b.blink = false; b.pose = 'attack'; b.poseF = 1;
      const shooters = [b.x, ...b.clones.filter(c => c.alive).map(c => c.x)];
      for (const sx of shooters) {
        const f = pcx < sx + b.w / 2 ? -1 : 1, tx = sx + b.w / 2 + f * 14, ty = b.y + b.h - 48 + 24, a = Math.atan2(pcy - ty, pcx - tx);
        for (const sp of (rage ? [-0.14, 0.14] : [0])) shFoxfire(tx, ty, a + sp, { foxDamage: B.illusionDamage, foxTurn: 0 }, B.illusionSpeed, 0);
      }
      sfx('bshoot'); b.fireT = 10;
    }
    if (b.t > A) { b.pose = 'attack'; b.poseF = 1; }
    if (b.t >= A + 16) { b.clones = []; shiranuiRecover(b, B); }
    return;
  }
  if (b.state === 'shRecover') {
    astarteFloat(b, B); b.pose = 'idle'; b.poseF = -1; b.blink = false; b.hidden = false;
    if (b.t >= b.recT) {
      if (b.comboLeft > 0) { b.comboLeft--; shiranuiStart(b, shiranuiPick(b)); }

    }
    return;
  }

}

// ---- drawing ----
const SHIRANUI_RED = {};   // red hit-flash copies per frame
function shiranuiRedFrame(sh, fi, face) {
  if (!SHIRANUI_RED[fi]) { const c = tintCanvas(sh[fi].r, '#ff2a40', 0.65); SHIRANUI_RED[fi] = { r: c, l: flipCanvas(c) }; }

}

  const red = b.flash > 0 && (b.flash & 2) && b.state !== 'rescue', ox = b.face >= 0 ? D.cx : D.fw - D.cx;
  const img = red ? shiranuiRedFrame(sh, fi, b.face) : pick(sh[fi], b.face, b.state === 'rescue' && b.t < 70 && (b.t & 4) !== 0);

function drawShiranuiMarks(b, camX, blink) {

    g.save(); g.globalAlpha = 0.45; g.fillStyle = glow; g.beginPath(); g.arc(x, y, r + 3, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 0.9; g.fillStyle = '#fff0d0'; g.fillRect(x - 1, y - 1, 2, 2); g.restore();

      for (let k = 0; k < 3; k++) { const h = hash(frame + k * 7, px | 0); g.fillRect(x - 6 + (h % 12), FLOOR_Y - 4 - ((h >> 6) % 6), 1, 1); }
      if (warn - b.t < 14 && SHEETS.shiranuiPillar && blink) { g.save(); g.globalAlpha = 0.4; g.drawImage(SHEETS.shiranuiPillar[0].r, 0, 32, 24, 16, x - 12, FLOOR_Y - 13, 24, 16); g.restore(); }
    }

}
// foxfire sprite (cell faces right, hit centre at (16,12)); used by the boss, the helper and the support move

}
function drawShiranuiBullet(q, camX) {
  const S = SHEETS.shiranuiBullets, cx = q.x + q.w / 2 - camX, cy = q.y + q.h / 2;

// ---- rescued シラヌイ as support: FOXFIRE DANCE (HELP button "FOX") ----
//  t20/30/40/50: four homing foxfires from her palm; each seeks the nearest enemy on screen (2 dmg) or the boss (1 dmg).
//  Total vs a boss: 4 (same as Star's MORPH / Astarthe's MOON CLEAVE).
function shiranuiSupportTarget(fx) {
  if (bossHittable() && boss.x + boss.w > cam.x && boss.x < cam.x + VW) return { boss: true, x: boss.x + boss.w / 2, y: boss.y + boss.h / 2 };
  let best = null, bd = 1e9;

    if (!e.alive || !e.active || e.x + e.w < cam.x || e.x > cam.x + VW) continue;
    const d = Math.hypot(e.x + e.w / 2 - fx.x, e.y + e.h / 2 - fx.y); if (d < bd) { bd = d; best = e; }

}
function updateShiranuiSupport(t) {
  support.x += (P.x + P.w / 2 - P.face * 20 - support.x) * 0.25; support.y += (P.y - support.y) * 0.25;
  if (t < 20) support.face = P.face;
  const f = support.face, fxs = support.fx || (support.fx = []);
  if (t === 20 || t === 30 || t === 40 || t === 50) {
    fxs.push({ x: support.x + f * 5, y: support.y + 2, vx: f * 2.2, vy: -1.4, t: 0, alive: true }); sfx('bshoot');
  }
  for (const q of fxs) {
    if (!q.alive) continue;
    q.t++;
    const tg = shiranuiSupportTarget(q);
    if (tg && q.t > 6) { const tx = tg.x - q.x, ty = tg.y - q.y, l = Math.hypot(tx, ty) || 1; q.vx += (tx / l * 3.4 - q.vx) * 0.18; q.vy += (ty / l * 3.4 - q.vy) * 0.18; }
    q.x += q.vx; q.y += q.vy;
    if (q.t % 3 === 0) spawnPart(q.x, q.y, -q.vx * 0.2, -q.vy * 0.2, 12, 4, (q.t >> 2) & 1 ? '#ffb060' : '#ff5a3a');
    if (tg && Math.abs(tg.x - q.x) < 9 && Math.abs(tg.y - q.y) < 12) {
      q.alive = false; popAt(q.x, q.y, '#ff8a4a');
      if (tg.boss) { boss.inv = 0; damageBoss(null, 1); }
      else { tg.e.hp -= 2; tg.e.flash = 10; if (tg.e.hp <= 0) killEnemy(tg.e); else sfx('ehit'); }
    }
    if (q.t > 110 || q.x < cam.x - 20 || q.x > cam.x + VW + 20 || q.y < -20 || q.y > VH) q.alive = false;
  }
  if ((t > 56 && !fxs.some(q => q.alive)) || t > 170) support.active = false;
}
function drawShiranuiSupport(t, x, y, camX) {
  const fr = SHEETS.shiranui, d = SHEET_DEFS.shiranui, f = support.face;
  const fi = t < 16 ? (t >> 3) & 1 : t < 56 ? 5 : 4;   // idle -> foxfire in palm -> waves her fan
  if (t < 12) g.globalAlpha = t / 12;
  if (fr) g.drawImage(pick(fr[Math.min(fi, fr.length - 1)], f, false), x - (f > 0 ? d.cx : d.fw - d.cx), y - 12);
  else g.drawImage(pick(SPR.ally.K[fi === 4 ? 1 : 0], f, false), x - 16, y - 12);
  g.globalAlpha = 1;
  for (const q of (support.fx || [])) if (q.alive) drawFoxfire(q.x - camX, q.y, q.vx, q.vy, (q.t >> 2) & 1, 1);
}

// =====================================================================
//  AREA 8  宵闇のカジノ MIDNIGHT CASINO - boss DARK ダイスロール (DiceRoll: a downer girl with white hair and a small
//  crown, trapped inside a crowned dice-headed harlequin). Ground walker. Every attack starts from the wind-up pose
//  (sprite frame 4, hand raised) with its own telegraph:
//    fate       tosses a big die over her head; the face (1-6, drawn 2x with a label) decides the follow-up:
//               1-2 ROULETTE with N balls / 3-4 CARDS fan of N / 5-6 CHIPS rain on N-1 columns
//    dice       2 dice (enraged 3) hop once, then roll along the floor (jump them)
//    cards      card fan with a guaranteed gap on Umine's standing spot (dotted preview paths + green floor mark):
//               stay on the floor where the mark is (or walk away from her) and every card misses
//    boomerang  spinning cards fly out and come back, one at a time (the next only after she catches the last;
//               a height mark shows which): low (jump), high (stand), low [enraged: + high]
//    chips      marked columns (Umine's + others, a free lane is always next to her), then chip stacks drop
//    roulette   the ball circles her hand, then bounces around the room (limited bounces)
//    flame      (enraged) flaming die bounces toward Umine, each bounce leaves 2 embers rolling on the floor
//    allin      once, below half HP: "ALL IN!" announcement, then chips -> cards -> dice back to back
//  Tuning: CONFIG.bosses.diceroll. Art: assets/diceroll_dark.png (+ .json), diceroll_bullets.png (24x24 cells).
// =====================================================================
const DICEROLL_PATS = ['fate', 'dice', 'cards', 'boomerang', 'chips', 'roulette'];
const DR_STATE = { fate: 'drFate', dice: 'drDice', cards: 'drCards', boomerang: 'drBoom', chips: 'drChips', roulette: 'drRoulette', flame: 'drFlame' };
// sprite hand points (48x48 frame, cx 24, feet y 47)
function drHand(b, px, py) { return { x: b.x + b.w / 2 + b.face * (px - 24), y: b.y + b.h - 48 + py }; }
function drThrowPt(b) { return drHand(b, 39, 23); }
function drCardPt(b) { return drHand(b, 36, 23); }
function drWindPt(b) { return drHand(b, 10, 21); }
function dicerollPick(b) {
  const pool = bossRage() ? DICEROLL_PATS.concat(['flame']) : DICEROLL_PATS;
  const unseen = pool.filter(k => !b.seen.includes(k) && k !== b.last);
  return unseen.length && Math.random() < 0.6 ? pickPattern([unseen[(Math.random() * unseen.length) | 0]]) : pickPattern(pool);
}
function dicerollStart(b, pat) { bossFacePlayer(); sfx('warn'); bossSet(DR_STATE[pat]); }
function dicerollRecover(b, B, short) { b.recT = short ? 12 : (bossRage() ? B.recoverRage : B.recover); bossSet('drRecover'); }
function drSpawn(x, y, vx, vy, kind, dmg, spr) { const q = spawnBullet(x - (BULLET_SIZE[kind] || [8, 8])[0] / 2, y - (BULLET_SIZE[kind] || [8, 8])[1] / 2, vx, vy, kind, dmg); if (q) q.sspr = spr; return q; }

// ---- per-bullet hooks (run before movement: they pre-correct position so x+=vx lands exactly) ----
function drFloorBounce(q, vyOut) { q.y = FLOOR_Y - q.h - vyOut; q.vy = vyOut; }
function drDieHook(q) { // kind 29: hops once, then rolls along the floor
  if (!q.roll) {
    q.vy += 0.22;
    if (q.y + q.h + q.vy >= FLOOR_Y) {
      if (q.bnc < 1) { q.bnc++; drFloorBounce(q, -1.6); sfx('tick'); }
      else { q.roll = true; drFloorBounce(q, 0); q.vy = 0; spawnPart(q.x + q.w / 2, FLOOR_Y - 1, -q.vx * 0.3, -0.3, 8, 1, '#ffffff'); }
    }
  } else { q.y = FLOOR_Y - q.h; q.vy = 0; }
  return false;
}
function drBoomHook(q) { // kind 30 boomerang card: constant speed out (range or wall), snaps back at the same height, caught by her
  const B = CONFIG.bosses.diceroll;
  if (!q.back) {
    if (Math.abs(q.x + q.w / 2 - q.x0) >= B.boomRange || (q.f > 0 && q.x + q.w + q.vx > ROOM_R - 2) || (q.f < 0 && q.x + q.vx < ROOM_L + 2)) {
      q.back = true; q.vx = -q.vx; sfx('swoosh'); spawnPart(q.x + q.w / 2, q.y + q.h / 2, 0, 0, 8, 1, '#ffd84a');
    }
  } else {
    const bc = boss.x + boss.w / 2;
    if ((q.x + q.w / 2 - bc) * q.f <= 0 || q.t > 240 || boss.state === 'rescue') { q.active = false; return true; }
  }
  return false;
}
function drBallHook(q) { // kind 32 roulette ball: bounces off walls / floor / ceiling, limited bounces
  const B = CONFIG.bosses.diceroll;
  if (!q.rel) { // circling her raised hand until she throws
    if (boss.state !== 'drRoulette' || boss.t >= q.relT) {
      q.rel = true; const a = q.ang0; q.vx = Math.cos(a) * B.rouletteSpeed * boss.face; q.vy = Math.sin(a) * B.rouletteSpeed; sfx('bshoot');
    } else {
      const h = drWindPt(boss), a = q.t * 0.35 + q.ph;
      q.x = h.x + Math.cos(a) * 9 - q.w / 2; q.y = h.y + Math.sin(a) * 6 - q.h / 2; q.vx = 0; q.vy = 0; return false;
    }
  }
  let hit = false;
  if (q.x + q.vx < ROOM_L + 1 || q.x + q.w + q.vx > ROOM_R - 1) { q.vx = -q.vx; hit = true; }
  if (q.y + q.h + q.vy >= FLOOR_Y) { drFloorBounce(q, -Math.abs(q.vy)); hit = true; }
  else if (q.y + q.vy < 22) { q.vy = Math.abs(q.vy); hit = true; }
  if (hit) { q.bnc++; sfx('tink'); spawnPart(q.x + q.w / 2, q.y + q.h / 2, 0, 0, 6, 1, '#ffffff'); }
  if (q.bnc > B.rouletteBounces || q.t > B.rouletteLife || boss.state === 'rescue') { popAt(q.x + q.w / 2, q.y + q.h / 2, '#ffffff'); q.active = false; return true; }
  return false;
}
function drFlameHook(q) { // kind 33 flaming die: bounces toward Umine, embers on every bounce
  const B = CONFIG.bosses.diceroll;
  q.vy += 0.16;
  if (q.x + q.vx < ROOM_L + 1 || q.x + q.w + q.vx > ROOM_R - 1) q.vx = -q.vx;
  if (q.t % 3 === 0) spawnPart(q.x + q.w / 2, q.y + q.h / 2, -q.vx * 0.2, -0.4, 12, 1, (q.t & 4) ? '#ffb040' : '#ff4a2a');
  if (q.y + q.h + q.vy >= FLOOR_Y) {
    q.bnc++; sfx('boomS'); shake(4, 1);
    for (const s of [-1, 1]) { const e = drSpawn(q.x + q.w / 2, FLOOR_Y - 4, s * 1.3, 0, 34, B.emberDamage, 0); if (e) { e.life = 54; e.y = FLOOR_Y - e.h; } }
    if (q.bnc >= B.flameBounces || boss.state === 'rescue') { popAt(q.x + q.w / 2, FLOOR_Y - 6, '#ff8a3a'); q.active = false; return true; }
    drFloorBounce(q, -3.4 * Math.pow(0.8, q.bnc));
  }
  return false;
}

// Card fan geometry. The gap is centred on Umine's STANDING box at her x when the fan locks (not where she is mid-jump),
// and widened until both gap cards clear that box (+ margin) over its whole width: standing still on the floor is always
// safe; the other cards fan out from there (upper side gets the extra card). Angles in screen space (y down).
function drCardLine(tp, a, x) { const c = Math.cos(a); if (Math.abs(c) < 1e-3 || (x - tp.x) * c <= 0) return null; return tp.y + (x - tp.x) * Math.tan(a); }
function drCardClear(tp, a, px, B) {
  const cy = FLOOR_Y - P.h / 2, half = (BULLET_SIZE[30][1] + P.h) / 2 + B.cardGapMargin, xs = [px - (BULLET_SIZE[30][0] + P.w) / 2, px + (BULLET_SIZE[30][0] + P.w) / 2];
  let side = 0;
  for (const x of xs) { const y = drCardLine(tp, a, x); if (y === null) continue; const d = y - cy; if (Math.abs(d) < half) return false; const sg = Math.sign(d); if (side && sg !== side) return false; side = sg; }
  return true;
}
function drCardFan(tp, px, face, n, B) {
  let tx = px; if ((tx - tp.x) * face < 40) tx = tp.x + face * 40;       // hugging her: aim just ahead
  const aim = Math.atan2(FLOOR_Y - P.h / 2 - tp.y, tx - tp.x);
  let half = B.cardGapMin;
  while (half < 1.2 && !(drCardClear(tp, aim - half, px, B) && drCardClear(tp, aim + half, px, B))) half += 0.01;
  const up = face > 0 ? -1 : 1, nUp = Math.ceil(n / 2), nDown = n - nUp, out = [];
  for (let k = 0; k < nUp; k++) out.push(aim + up * (half + k * B.cardSpread));
  for (let k = 0; k < nDown; k++) out.push(aim - up * (half + k * B.cardSpread));
  return out;
}

// ---- AI ----
function aiDiceroll(b, B, pcx, pcy) {
  bossFall(b);
  const rage = bossRage(), cx = b.x + b.w / 2, dx = pcx - cx, dist = Math.abs(dx);
  b.x = Math.max(ROOM_L + 4, Math.min(ROOM_R - b.w - 4, b.x));
  if (!b.allin && b.hp <= B.hp / 2 && (b.state === 'hover' || b.state === 'drRecover')) { // one-time desperation combo
    b.allin = true; b.allinStep = 0; bossSeen('allin'); bossFacePlayer(); sfx('warn'); shake(8, 2); bossSet('drAllin'); return;
  }
  if (b.state === 'hover') { // walk: keep ~90 px from Umine
    bossFacePlayer(); b.fateN = 0; b.fateCount = 0;
    const ideal = 90, sp = rage ? B.walkSpeedRage : B.walkSpeed; let moving = false;
    if (dist > ideal + 14) { b.x += Math.sign(dx) * sp; moving = true; }
    else if (dist < ideal - 24 && dist > 2) { const nx = b.x - Math.sign(dx) * sp; if (nx > ROOM_L + 6 && nx + b.w < ROOM_R - 6) { b.x = nx; moving = true; } }
    b.pose = moving ? 'walk' : 'idle'; b.poseF = -1;
    if (b.t >= (rage ? B.idleFramesRage : B.idleFrames)) { b.comboLeft = Math.random() < (rage ? B.comboChanceRage : B.comboChance) ? 1 : 0; dicerollStart(b, dicerollPick(b)); }
    return;
  }
  if (b.state === 'drAllin') { // "ALL IN!" then chips -> cards -> dice
    b.pose = 'windup'; b.poseF = 0;
    if (b.t % 6 === 0) spawnPart(cx + (hash(b.t, 3) % 40) - 20, b.y - 4, 0, -0.6, 18, 1, (b.t & 8) ? '#ffd84a' : '#ff4a5a');
    if (b.t >= B.allinAnnounce) { b.allinStep = 1; b.fateCount = rage ? 5 : 4; dicerollStart(b, 'chips'); }
    return;
  }
  if (b.state === 'drFate') { // big die over her head decides the next attack
    const show = rage ? B.fateShowRage : B.fateShow;
    if (b.t < 12) { b.pose = 'windup'; b.poseF = 0; bossFacePlayer(); }
    else if (b.t < 12 + B.fateRoll) { b.pose = 'throwDice'; b.poseF = 0; if (b.t === 12) sfx('swoosh'); if (b.t % 5 === 0) sfx('tick'); }
    else { b.pose = 'idle'; b.poseF = 0; }
    if (b.t === 12 + B.fateRoll) {
      let n = 1 + ((Math.random() * 6) | 0); if (n === b.fateLast) n = 1 + ((n + ((Math.random() * 5) | 0)) % 6); b.fateLast = n;
      b.fateN = n; sfx('cp'); shake(3, 1); popAt(cx, b.y - 22, '#ffffff');
    }
    if (b.t >= 12 + B.fateRoll + show) {
      const n = b.fateN;
      if (n <= 2) { b.fateCount = n; bossSet('drRoulette'); }
      else if (n <= 4) { b.fateCount = n; bossSet('drCards'); }
      else { b.fateCount = n - 1; bossSet('drChips'); }
      bossFacePlayer(); b.fateN = 0; b.fateShown = n;
    }
    return;
  }
  if (b.state === 'drDice') { // dice hop once, then roll along the floor
    const wind = rage ? B.diceWindRage : B.diceWind, n = b.allinStep === 3 ? 3 : (rage ? B.diceCountRage : B.diceCount);
    const k = b.t - wind;
    if (k < 0) { b.pose = 'windup'; b.poseF = 0; bossFacePlayer(); }
    else { const i = Math.floor(k / B.diceGap), kk = k % B.diceGap; b.pose = i < n && kk < 10 ? 'throwDice' : 'idle'; b.poseF = 0; }
    if (k >= 0 && k % B.diceGap === 0 && k / B.diceGap < n) {
      const tp = drThrowPt(b), sp = (rage ? B.diceSpeedRage : B.diceSpeed) * (1 + (k / B.diceGap) * 0.12);
      const q = drSpawn(tp.x, tp.y, b.face * sp, -2.4, 29, B.diceDamage, 0);
      if (q) { q.hook = drDieHook; q.face = (Math.random() * 6) | 0; } sfx('bshoot');
    }
    if (k >= n * B.diceGap + 6) dicerollRecover(b, B, b.allinStep > 0);
    return;
  }
  if (b.state === 'drCards') { // card fan with a guaranteed safe gap where Umine stands (preview lines + green floor mark)
    if (!b.cardW) { b.cardW = b.fateCount ? B.cardWindFate : (rage ? B.cardWindRage : B.cardWind); b.cardN = b.fateCount || (rage ? B.cardCountRage : B.cardCount); b.cardAngs = null; }
    const wind = b.cardW, n = b.cardN, lock = wind - B.cardPreview;
    b.pose = b.t < wind ? 'windup' : 'flickCards'; b.poseF = 0;
    if (b.t < lock) bossFacePlayer();
    if (b.t === Math.max(1, lock)) { const tp = drCardPt(b); b.cardSafeX = pcx; b.cardAngs = drCardFan(tp, pcx, b.face, n, B); }
    if (b.t === wind && b.cardAngs) {
      const tp = drCardPt(b);
      for (const a of b.cardAngs) drSpawn(tp.x, tp.y, Math.cos(a) * B.cardSpeed, Math.sin(a) * B.cardSpeed, 30, B.cardDamage, 0);
      sfx('swoosh');
    }
    if (b.t >= wind + 22) { b.fateCount = 0; b.cardW = 0; b.cardAngs = null; if (b.allinStep === 2) { b.allinStep = 3; dicerollStart(b, 'dice'); } else dicerollRecover(b, B, false); }
    return;
  }
  if (b.state === 'drBoom') { // boomerang cards one at a time (next one only after she catches the last): low (jump) / high (stand) / low [enraged: + high]
    const wind = rage ? B.boomWindRage : B.boomWind, n = b.pr ? 4 : 3;
    if (b.t <= 1 || b.boomI === undefined) { b.boomI = 0; b.boomAt = wind; b.boomFlick = -99; }
    const flying = bullets.some(q => q.active && q.boom);
    if (flying) b.boomAt = Math.max(b.boomAt, b.t + B.boomGap);
    else if (b.boomI < n && b.t < b.boomAt) bossFacePlayer();
    if (!flying && b.boomI < n && b.t >= b.boomAt) {
      const high = (b.boomI & 1) === 1, y = high ? FLOOR_Y - 40 : FLOOR_Y - 9;
      const q = drSpawn(cx + b.face * 12, y, b.face * B.boomSpeed, 0, 30, B.boomDamage, 1);
      if (q) { q.hook = drBoomHook; q.f = b.face; q.back = false; q.boom = true; q.x0 = q.x + q.w / 2; }
      b.boomI++; b.boomFlick = b.t; sfx('swoosh');
    }
    b.poseF = 0; b.pose = b.t - b.boomFlick < 10 ? 'flickCards' : (!flying && b.boomI < n ? 'windup' : 'idle');
    if ((b.boomI >= n && !flying && b.t - b.boomFlick > 10) || b.t > 420) { b.boomI = undefined; dicerollRecover(b, B, false); }
    return;
  }
  if (b.state === 'drChips') { // marked columns, then chip stacks fall there
    const warn = b.allinStep === 1 ? 36 : (rage ? B.chipWarnRage : B.chipWarn), n = b.fateCount || (rage ? B.chipColsRage : B.chipCols);
    b.pose = b.t < warn ? 'windup' : 'flickCards'; b.poseF = 0;
    if (b.t === 1) {
      const lanes = 8, lw = (ROOM_R - ROOM_L) / lanes, pl = Math.max(0, Math.min(lanes - 1, Math.floor((pcx - ROOM_L) / lw)));
      const nb = [pl - 1, pl + 1].filter(v => v >= 0 && v < lanes), safe = nb[(Math.random() * nb.length) | 0];
      const cand = []; for (let i = 0; i < lanes; i++) if (i !== pl && i !== safe) cand.push(i);
      for (let i = cand.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = cand[i]; cand[i] = cand[j]; cand[j] = t; }
      const cols = [pl].concat(cand.slice(0, Math.min(n, 6) - 1));
      b.chipCols = cols.map(c => ROOM_L + (c + 0.5) * lw); sfx('warn');
    }
    const k = b.t - warn;
    if (k >= 0 && k % 7 === 0 && k / 7 < 3) {
      for (const x of b.chipCols) { const q = drSpawn(x, -4, 0, B.chipSpeed, 31, B.chipDamage, (k / 7 + (x | 0)) & 1); if (q) q.chip = true; }
      if (k === 0) sfx('bshoot');
    }
    if (k >= 3 * 7 + 34) { b.chipCols = []; b.fateCount = 0; if (b.allinStep === 1) { b.allinStep = 2; b.fateCount = 5; dicerollStart(b, 'cards'); } else dicerollRecover(b, B, false); }

function artH(a,b){let h=(a*374761393+b*668265263)|0;h=(h^(h>>>13))*1274126177|0;return(h^(h>>>16))>>>0;}
function artR(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h);}
function artSolid(r,c,row){if(row<0||row>=r.grid.length||c<0||c>=r.grid[0].length)return true;return r.grid[row][c]==='#';}
function artFree(r,c0,r0,c1,r1){for(let y=r0;y<=r1;y++)for(let x=c0;x<=c1;x++){if(y<0||x<0||y>=r.grid.length||x>=r.grid[0].length)return false;if(r.grid[y][x]!=='.'&&!/[a-zA-Z0-9]/.test(r.grid[y][x]))return false;if(r.grid[y][x]==='#')return false;}return true;}
function artInScene(r,c,row,type){return(r.scenes||[]).some(s=>(!type||s[0]===type)&&c>=s[1]&&c<s[1]+s[3]&&row>=s[2]&&row<s[2]+s[4]);}

function artBackWall0(c,r,A){const W=r.w,H=r.h,[base,blk,hi,mor,trim,trimHi]=A.wall;

  for(let x=0;x<W;x+=32){artR(c,x,0,31,H,blk);artR(c,x+31,0,1,H,mor);for(let y=0;y<H;y+=4)if(artH(x,y)%5===0)artR(c,x+4+artH(y,x)%22,y,2,1,hi);}
 }else if(r.area==='tower'){ // red-brown brick, rivetted iron bands
  for(let y=0;y<H;y+=8)for(let x=-(y/8&1)*8;x<W;x+=16){const v=artH(x,y)%4;artR(c,x+1,y+1,14,6,v===0?hi:blk);artR(c,x+1,y+1,14,1,v===1?trim+'55':hi);}
  for(let y=96;y<H;y+=160){artR(c,0,y,W,6,'#2c2b3a');artR(c,0,y,W,1,'#5b5a70');for(let x=6;x<W;x+=24)artR(c,x,y+2,2,2,'#8f8aa0');}
 }else if(r.area==='water'){ // large wet ashlar with moss streaks
  for(let y=0;y<H;y+=24)for(let x=-(y/24&1)*24;x<W;x+=48){artR(c,x+1,y+1,46,22,artH(x,y)%3?blk:hi);artR(c,x+1,y+1,46,1,'#2a5466');if(artH(y,x)%4===0)for(let k=0;k<22;k+=2)artR(c,x+8+artH(x,k)%30,y+1+k,1,2,'#2b5f52');}
 }else if(r.area==='star'){ // polished night marble with veins and glyph rings
  for(let y=0;y<H;y+=32)for(let x=0;x<W;x+=32){artR(c,x,y,31,31,artH(x,y)%3?blk:hi);artR(c,x,y,31,1,'#323d6c');}
  c.strokeStyle='#3c4a85';c.lineWidth=1;for(let i=0;i<W*H/9000;i++){const x=artH(i,7)%W,y=artH(i,9)%H;c.beginPath();c.moveTo(x,y);for(let k=1;k<6;k++)c.lineTo(x+k*9,y+((artH(i,k)%11)-5));c.stroke();}
 }else{ // hub/mansion ashlar + wallpaper above wainscot
  for(let y=0;y<H;y+=16)for(let x=-(y/16&1)*16;x<W;x+=32){const v=artH(x,y)%5;artR(c,x+1,y+1,30,14,v===0?hi:blk);artR(c,x+1,y+1,30,1,v===0?trim+'66':hi);}
  if(r.area==='hub'){for(let x=0;x<W;x+=12){artR(c,x,0,5,H,'rgba(140,100,120,.10)');}for(let y=6;y<H;y+=24)for(let x=6;x<W;x+=24)artR(c,x,y,2,2,'rgba(220,180,140,.18)');}
 }

function artTrims(c,r,A){const[ ,blk,hi,mor,trim,trimHi]=A.wall,rows=r.grid.length,cols=r.grid[0].length;

// floor props, wall props (sconces, shelves, pipes, gears, crystals) -- deterministic per room
function artProps(c,r,A,lights){const rows=r.grid.length,cols=r.grid[0].length,area=r.area;
 // floor runs: [row, c0, c1] where row is the free row standing on solid
 const runs=[];for(let row=1;row<rows;row++){let s=null;for(let col=0;col<=cols;col++){const ok=col<cols&&!artSolid(r,col,row)&&artSolid(r,col,row+1)&&!artSolid(r,col,row-1)&&!artSolid(r,col,row-2);if(ok&&s===null)s=col;if(!ok&&s!==null){runs.push([row,s,col-1]);s=null;}}}
 for(const[row,a,b]of runs){const y=(row+1)*16;

   if(area==='water'&&hsh%3===1){artR(c,x-10,y-2,22,2,'#5ad0d8');artR(c,x-6,y-3,12,1,'#b6fbff');continue;}
   if(area==='star'&&hsh%3===0){artCrystal(c,x,y,A);lights.push({x,y:y-14,r:48,blue:1});continue;}

  }}
 // wall sconces at pilaster seams, two tiles above floors
 for(let x=128;x<r.w;x+=128)for(let row=2;row<rows;row++){const col=x>>4;if(!artSolid(r,col,row+1)||artSolid(r,col,row)||artSolid(r,col,row-1)||artSolid(r,col,row-3))continue;if(area==='garden'||area==='play')continue;

 // area set-pieces on big blank walls

 if(area==='tower'){for(let x=96;x<r.w;x+=224)for(let band=0;band<r.h;band+=240){const cx0=x>>4,ry=(band+150)>>4;if(artFree(r,cx0-3,ry-3,cx0+3,ry+3))artGear(c,x,band+150,34,12,0,'#2f2f45','#4a4a66');}}
 if(area==='library'){for(let x=200;x<r.w;x+=256)for(let band=0;band<r.h;band+=240){const cx0=x>>4,ry=(band+56)>>4;if(artFree(r,cx0-2,ry-1,cx0+2,ry+2))artPortrait(c,x,band+56);}}

function hoshiAnimPick(list,ms,t,loop){const L=Array.isArray(ms)?ms:list.map(()=>+ms||160),tot=L.reduce((a,b)=>a+b,0),now=t*16.667;let x=loop===false?Math.min(now,tot-1):now%tot;for(let k=0;k<list.length;k++){if(x<L[k])return list[k];x-=L[k];}return list[list.length-1];}

 if(art.mode==='sequel'){const fr=m.frames||[];for(const n of names){const a=an[n];let list=a?.frames||(Array.isArray(m[n])?m[n]:null),ms=a?.ms||160;if(!list){const i=fr.findIndex(f=>f.name===n||f.name?.startsWith(n));if(i>=0)list=[i];}if(list&&list.length)return fr[hoshiAnimPick(list,ms,t,a?.loop)];}return fr[0];}
 for(const n of names){const a=an[n];if(a)return hoshiAnimPick(a.frames,a.ms||(a.fps?1000/a.fps:(m.ms&&m.ms[n])||200),t,a.loop);}return 0;}

function mansionHoshiMode(e,m){e.mode=m;e.mt=0;}
function mansionHoshiGaps(e,n,w){const out=[],span=HOSHI_R-HOSHI_L-w;for(let i=0;i<n;i++){let x=HOSHI_L+((artH(e.cycle*7+i,M.t>>4)%1000)/1000)*span;for(let k=0;k<6&&out.some(g=>Math.abs(g-x)<w*2.2);k++)x=HOSHI_L+((x-HOSHI_L+span*.37)%span);out.push(Math.round(x));}return out.map(x=>[x,x+w]);}
function mansionHoshiAI(e){if(M.hoshiState!=='active'){e.mode='idle';return;}const rage=e.hp<=e.maxHp/2,t=++e.mt,dx=M.x-e.x;e.st++;
 if(rage&&!e.raged){e.raged=true;mansionSay('「ちょ、マジ痛いんだけど！ 本気出すし！」',150);mansionBurst(e.x,e.y-30,'#c99aff',16);}
 if(e.mode==='walk'){e.face=Math.sign(dx)||e.face;const d=Math.abs(dx);if(d>180)e.x+=e.face*(rage?1.3:1);else if(d<140)e.x-=e.face*1.2;
  if(t>(rage?40:64)){const seq=['shoot','dash','shoot','rain'];mansionHoshiMode(e,seq[e.cycle%4]);e.cycle++;if(e.mode==='rain'){e.fromX=e.x;e.fromY=e.y;}}}
 else if(e.mode==='shoot'){const WIND=36,GAP=rage?32:36,n=rage?3:2;e.face=t<WIND?Math.sign(dx)||e.face:e.face;
  if(t===1)e.pattern=Array.from({length:n},(_,i)=>rage?(i%2===1):false);  // false = high (slide under), true = low (jump over)
  if(t>=WIND&&(t-WIND)%GAP===0&&(t-WIND)/GAP<n){const low=e.pattern[(t-WIND)/GAP];M.enemyShots.push({kind:'hStar',low,x:e.x+e.face*16,y:HOSHI_FLOOR-(low?6:20),vx:e.face*(rage?2.8:2.4),vy:0,damage:2});sfx('shot');}
  if(t>WIND+GAP*n+20)mansionHoshiMode(e,'walk');}
 else if(e.mode==='dash'){const TELE=rage?30:40;if(t===1){e.dashes=rage?2:1;e.edge=e.x<M.x?HOSHI_L:HOSHI_R;}
  if(t<=TELE){/* telegraph: back off to the far edge, then crouch with a floor line */if(e.edge!=null){const d=e.edge-e.x;e.x+=Math.sign(d)*Math.min(Math.abs(d),6);if(Math.abs(d)<1)e.edge=null;}e.face=Math.sign(M.x-e.x)||e.face;}
  else{e.x+=e.face*(rage?6:5.2);if(e.x<HOSHI_L||e.x>HOSHI_R){e.x=Math.max(HOSHI_L,Math.min(HOSHI_R,e.x));e.dashes--;if(e.dashes>0){e.face*=-1;e.mt=TELE-22;}else mansionHoshiMode(e,'walk');}}}
 else if(e.mode==='rain'){const RISE=24,TELE=60,RAIN=rage?120:84,W=rage?44:52,n=2,cx=(HOSHI_L+HOSHI_R)/2;
  if(t===1){e.gaps=mansionHoshiGaps(e,n,W);e.nextGaps=null;e.shiftAt=rage?RISE+TELE+50:null;}

  if(e.shiftAt&&t===e.shiftAt-40){e.nextGaps=mansionHoshiGaps({cycle:e.cycle+5},n,W);}            // telegraph the moved gaps 40 frames early
  if(e.shiftAt&&t===e.shiftAt){e.gaps=e.nextGaps;e.nextGaps=null;}
  if(t>RISE+TELE&&t<RISE+TELE+RAIN&&t%4===0){const safe=[...e.gaps,...(e.nextGaps||[])];let x=null;for(let k=0;k<8&&x==null;k++){const c=HOSHI_L-20+artH(t,k)%(HOSHI_R-HOSHI_L+40);if(!safe.some(([a,b])=>c>a-8&&c<b+8))x=c;}if(x!=null)M.enemyShots.push({kind:'hStarRain',x,y:14,vx:0,vy:3.4,damage:2});}
  if(t>RISE+TELE+RAIN+50){const k=Math.min(1,(t-RISE-TELE-RAIN-50)/20);e.y=HOSHI_FLOOR-80*(1-k);if(k>=1){e.y=HOSHI_FLOOR;e.gaps=[];mansionHoshiMode(e,'walk');}}}
 e.x=Math.max(HOSHI_L-8,Math.min(HOSHI_R+8,e.x));
 const box=e.mode==='dash'&&e.mt>(rage?30:40)?[e.x-9,e.y-34,18,27]:[e.x-8,e.y-40,16,40];
 if(mansionOverlap(M.x-MC.w/2,M.y-M.h,MC.w,M.h,box))mansionDamage(2,M.x<e.x?-1:1);}
