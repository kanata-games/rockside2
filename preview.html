    const h = hash(i, 23), sp = ((h >>> 20) & 3) + 1; let x = Math.floor((h % VW) - t * sp * 1.5) % VW; if (x < 0) x += VW;
    g.fillStyle = sp > 2 ? '#8a90c0' : '#3a4070'; g.fillRect(x, (h >>> 9) % VH, sp > 2 ? 3 : 1, 1);
  }
  const bandY = 66, bandH = 110;
  g.fillStyle = '#1c1240'; g.fillRect(0, bandY, VW, bandH);
  g.fillStyle = '#261a52'; for (let y = bandY + ((t >> 1) & 3); y < bandY + bandH; y += 4) g.fillRect(0, y, VW, 1);
  const BT = BOSS_TYPES[a.boss] || BOSS_TYPES.tobiume;
  g.fillStyle = BT.speakerColor; g.fillRect(0, bandY, VW, 2); g.fillRect(0, bandY + bandH - 2, VW, 2);
  // boss drops into the band (2x): idle frames of her DARK sheet (procedural fallback)
  const fr = SHEETS[BT.dark], size = fr ? 48 : 40;
  let img;
  if (fr) img = fr[(frame >> 4) & 1].r;
  else if (a.boss === 'tobiume') img = SPR.tobi.dark.idle[(frame >> 3) & 1].r;
  else { const k = BT.ally || 'A'; SPR.allyDark = SPR.allyDark || {}; if (!SPR.allyDark[k + 0]) SPR.allyDark[k + 0] = sheetSprite(tintCanvas(SPR.ally[k][0].r, '#1a0828', 0.72)); img = SPR.allyDark[k + 0].r; }
  const ty = bandY + bandH - 2 - size * 2 + 6, y = t < 26 ? Math.round(-size * 2 + (ty + size * 2) * (1 - Math.pow(1 - t / 26, 2))) : ty;
  g.save(); g.beginPath(); g.rect(0, 0, VW, bandY + bandH - 2); g.clip();
  g.drawImage(img, 14, y, size * 2, size * 2); g.restore();
  // boss name typed letter by letter (pixel font), JP name below (hi-res, after blit)
  const words = a.bossEn.split(' '); let n = Math.max(0, Math.floor((t - 30) / 3));
  for (let i = 0; i < words.length; i++) {
    const wd = words[i].slice(0, Math.max(0, n)); n -= words[i].length;
    drawTextShadow(wd, 128, bandY + 18 + i * 16, 'y', 2);
  }
  drawText('AREA ' + areaNo(a), VW / 2, 24, 'c', 1, 'c');
  drawText(a.en, VW / 2, 50, 'w', 1, 'c');
  if (t > 70 && ((frame >> 4) & 1)) drawTextShadow('TAP TO START', VW / 2, 206, 'w', 1, 'c');
  if (t < 8) { g.fillStyle = 'rgba(255,255,255,' + (1 - t / 8) + ')'; g.fillRect(0, 0, VW, VH); } // white flash
  blit();
  drawHiText(a.name, VW / 2, 33, 10, '#ffd6ec', '#120e24');
  if (t > 30 + a.bossEn.replace(' ', '').length * 3) drawHiText(a.bossName, 188, bandY + 58, 12, '#ffffff', '#3a0a28');
  if (t > 50 && a.bossAlias) drawHiText('〜 ' + a.bossAlias + ' 〜', 188, bandY + 80, 7.5, BT.speakerColor, '#120e24');
}

function render() {
  g.setTransform(1, 0, 0, 1, 0, 0);
  mansionUI();
  if(state === 'mansion' || state === 'mansionClear'){renderMansion();return;}
  if (state === 'opening' || state === 'openingPlay' || state === 'openingDone') { renderOpening(); return; }
  if (state === 'title') { renderTitle(); blit(); drawHiText('〜 知らない天井と、ふしぎな右手 〜', VW / 2, 102, 8, '#ffd6ec', '#120e24'); return; }
  if (state === 'select' || (state === 'areaIntro' && stateT < 24)) { renderSelect(); return; }
  if (state === 'areaIntro') { renderAreaIntro(); return; }
  if (state === 'theEnd') { renderTheEnd(); return; }
  if (state === 'ending' && typeof renderEnding === 'function') { renderEnding(); return; }
  const camX = Math.round(cam.x);
  drawBackground(camX);
  let sx = 0, sy = 0;
  if (shakeT > 0) { sx = (shakeT & 1 ? 1 : -1) * shakeMag; sy = ((shakeT >> 1) & 1 ? 1 : -1) * Math.max(1, shakeMag >> 1); }
  g.setTransform(1, 0, 0, 1, sx, sy);
  g.drawImage(levelCv, camX, 0, VW, VH, 0, 0, VW, VH);
  drawDoor(camX); drawAllies(camX); drawStageUmimi(camX);
  for (let i = 0; i < enemies.length; i++) { const e = enemies[i]; if (e.alive && e.active) drawEnemy(e, camX); }
  drawLilyBossSpotlight(camX);
  if (curArea.boss === 'lily' && bossUmimi.active && bossUmimi.state === 'platform') drawBossUmimi(camX);
  drawBoss(camX);
  if (!(curArea.boss === 'lily' && bossUmimi.active && bossUmimi.state === 'platform')) drawBossUmimi(camX);
  drawWaterOrb(camX);
  drawSupport(camX);
  if (!(state === 'ready' && (stateT & 8))) drawPlayer(camX);
  for (let i = 0; i < shots.length; i++) if (shots[i].active) drawShot(shots[i], camX);
  drawArrows(camX);
  for (let i = 0; i < bullets.length; i++) if (bullets[i].active) drawBullet(bullets[i], camX);
  drawParticles(camX);
  if (curArea.final) drawFinalWorld(camX);
  if (DEBUG.hitbox) drawHitboxes(camX);
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (!(curArea.final && (state === 'climax' || state === 'finale'))) drawHUD();
  if (state === 'ready' && ((stateT >> 3) & 1) === 0) drawTextShadow('GET SET!', VW / 2, 104, 'y', 2, 'c');
  if (state === 'bossIntro' && introPhase === 2 && (frame >> 3) & 1) drawTextShadow('WARNING', VW / 2, 60, 'r', 2, 'c');
  if (state === 'gameover') {
    dim(Math.min(0.7, stateT / 30));
    drawTextShadow('GAME OVER', VW / 2, 84, 'r', 3, 'c');
    if (stateT > 30 && (frame >> 5) & 1) drawTextShadow('TAP OR ENTER TO RETRY', VW / 2, 120, 'w', 1, 'c');
    drawText(checkpoint ? 'RESTART FROM CHECKPOINT' : 'RESTART FROM STAGE START', VW / 2, 136, 'b', 1, 'c');
  }
  if (state === 'clear') {
    dim(Math.min(0.6, stateT / 40));
    drawTextShadow('STAGE CLEAR!', VW / 2, 70, 'y', 3, 'c');
    drawText(BOSS_TYPES[curArea.boss].clearEn, VW / 2, 100, 'c', 1, 'c');
    const secs = Math.floor(stats.playFrames / 60);
    drawText('TIME ' + Math.floor(secs / 60) + ':' + (secs % 60 < 10 ? '0' : '') + (secs % 60) + '   KILLS ' + stats.kills, VW / 2, 114, 'w', 1, 'c');
    if (stateT > 60 && (frame >> 5) & 1) drawTextShadow('TAP OR ENTER: STAGE SELECT', VW / 2, 150, 'w', 1, 'c');
  }
  if (curArea.final) drawFinalOverlay();
  blit();
  if (support.active && support.t < 106) {
    if (support.kind === 'neenia') drawHiText('ネーニア・星降る矢雨！', VW / 2, 67, 8, '#e2ecff', '#253568');
    else if (support.kind === 'seiten') drawHiText('青天・守護の歌！', VW / 2, 67, 8, '#ffe5eb', '#661b37');
    else if (support.kind === 'astarte') drawHiText('アスターテ・月影の一閃！', VW / 2, 67, 8, '#ece7ff', '#30236e');
    else if (support.kind === 'lily') drawHiText('リリィ＆ウミミ・スターライトレイン！', VW / 2, 67, 8, '#fff1cf', '#6e285e');
    else if (support.kind === 'diceroll') { if (support.t < 90) drawHiText('ダイスロール・運命のダイス！', VW / 2, 67, 8, '#fff4d8', '#6a1020'); }
    else if (support.kind === 'shiranui') { if (support.t < 80) drawHiText('シラヌイ・狐火の舞じゃ！', VW / 2, 67, 8, '#ffe8d8', '#6e1a24'); }
    else if (support.kind === 'star') { if (support.t < 80) drawHiText('スターさん・錬金モーフスラッシュ！', VW / 2, 67, 8, '#e0f8ff', '#1d3e6e'); }
    else if (support.t < 75) drawHiText('スーパーウルトラ飛梅ちゃんキック！', VW / 2, 67, 8, '#ffe0ee', '#581d4b');
  }
  // ---- high-res overlays: speech bubbles / dialogue / Japanese lines ----
  if (state === 'play' || state === 'ready' || state === 'bossIntro') {
    for (let i = 0; i < allies.length; i++) {
      const a = allies[i]; if (a.bubbleT <= 0) continue;
      const sx2 = a.x - camX; if (sx2 < -10 || sx2 > VW + 10) continue;
      const info = a.type === 'I' ? { name: 'リリィ', color: '#d06aa8' } : ALLY_INFO[a.type];
      drawBubble(sx2, a.y - 34, info.name, info.color, a.line, a.bubbleT < 20 ? a.bubbleT / 20 : 1);
    }
  }
  const BT = BOSS_TYPES[curArea.boss];
  if (boss.state === 'rescue' && boss.t >= 100 && state === 'play') drawDialogue(BT.speaker, BT.speakerColor, BT.line, Math.min(1, (boss.t - 100) / 15), 36, BT.face); // top: keeps both characters visible
  if (state === 'clear') drawHiText(BT.clearJp, VW / 2, 126, 8, '#ffc0dc', '#120e24');
  if (curArea.final) drawFinalHi();
}
// Fill the screen at any size without shimmer: blow the frame up by a whole number with
// hard edges first, then shrink that smoothly to the real size. Every game pixel ends up
// the same width; only its outer edge is softened by under one screen pixel.
let blitMid = null, blitK = 0;
function blit() {
  const sw = screen.width, sh = screen.height;
  const k = Math.max(1, Math.ceil(Math.min(sw / VW, sh / VH) - 1e-6));
  if (VW * k === sw && VH * k === sh) { sctx.imageSmoothingEnabled = false; sctx.drawImage(buf, 0, 0, sw, sh); return; }
  if (!blitMid || blitK !== k) { blitMid = mkCanvas(VW * k, VH * k); blitK = k; }
  const mg = blitMid.getContext('2d');
  mg.imageSmoothingEnabled = false; mg.drawImage(buf, 0, 0, VW * k, VH * k);
  sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = 'high';
  sctx.drawImage(blitMid, 0, 0, sw, sh);
  sctx.imageSmoothingEnabled = false;
}

// =====================================================================
//  Main loop: fixed 60Hz simulation, render every animation frame
// =====================================================================
const STEP = 1000 / 60;
let lastT = performance.now(), acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = now - lastT; lastT = now;
  if (dt > 250) dt = 250; if (dt < 0) dt = 0;
  acc += dt; let n = 0;
  while (acc >= STEP && n < 5) { update(); acc -= STEP; n++; }
  if (n >= 5) acc = 0;
  render();
}
loadSheets();
resetStage(false); setState('title');
if (DEBUG.area) { const a = AREAS.find(x => x.no === DEBUG.area && x.map); if (a) startGame(a); } // ?area=N: straight into the stage
if (DEBUG.ending) startEnding(); // ?ending=1: straight to the ending party + credits
requestAnimationFrame(loop);

// Debug / test hook (harmless in production)
window.ROCKSIDE = { CONFIG, P, boss, enemies, stats, cam, layout, DEBUG, shots, bullets, allies, arrows, SHEETS_LOADED, SHEET_DEFS,
  M, MR, MC, mansionStart, mansionEnter, mansionInput, mansionUse, AREAS, progress, support, stageUmimi, magic, PROGRESS_KEY, SEQUEL_MODEL, setSequelModel, sequelMuzzle, SEL, SEL_BACK, SEL_SUPPORT, TITLE_HARD, TITLE_RESET, cellRect, clearedCount, finalUnlocked,
  get hardMode() { return hardMode; }, get playerMaxHP() { return playerMaxHP(); },
  get state() { return state; }, get stateT() { return stateT; }, get checkpoint() { return checkpoint; },
  get selCursor() { return selCursor; }, get selMsg() { return selMsg; }, get curArea() { return curArea.id; }, get bossSeen() { return boss.seen.slice(); }, get floorY() { return FLOOR_Y; }, get resetArmed() { return resetArmT > 0; },
  teleport(x, y) { P.x = x; P.y = y; P.vx = 0; P.vy = 0; cam.x = clampCam(x - VW / 2); },
  _test: { loadArea, isCleared, isRescued, keys, inp, portraitFace, solidAt: solid, barGeom, cellLabel }, BOSS_TYPES,
  get ending() { return { phase: ENDING.phase, t: ENDING.t, credY: ENDING.credY, thanksT: ENDING.thanksT, h: creditsHeight() }; },
  get final() { return { phase: FINAL.phase, rushIdx: FINAL.rushIdx, climaxT: FINAL.climaxT, finaleI: FINAL.finaleI, swallowed: FINAL.swallowed, boss: curArea.boss }; },
  get roomX() { return ROOM_X; }, get cpX() { return CP_C * TS; }, get levelW() { return LEVEL_W; } };
if (document.modelContext?.registerTool) {
  const lifetime = new AbortController();
  const tools = [
    {name:'read_sequel_model',description:'Read the selected Umine model and sequel test state.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({size:SEQUEL_MODEL.size,loaded:SEQUEL_MODEL.frames.length===8,state,health:P.hp})},
    {name:'set_sequel_model',description:'Select the same model size as the visible comparison buttons.',inputSchema:{type:'object',properties:{size:{type:'integer',enum:[32,40,48]}},required:['size'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||Object.keys(input).length!==1||!Number.isInteger(input.size))throw new Error('Expected a model size');setSequelModel(input.size);return {size:SEQUEL_MODEL.size,loaded:SEQUEL_MODEL.frames.length===8};}}
  ];
  for(const tool of tools){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifetime.signal})).catch(()=>{});}catch{}}
  window.addEventListener('pagehide',()=>lifetime.abort(),{once:true});
}
