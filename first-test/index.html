</style></head><body><main><header><div><div class="eyebrow">UMINE ADVENTURE II</div><h1>海音ちゃんの冒険２ <span style="font-size:13px;color:#91a4ce">／ TEST 01</span></h1></div><button id="reset">やりなおす</button></header><div class="game"><canvas id="game" width="640" height="360" aria-label="海音ちゃんの横スクロールアクション"></canvas><div class="panel" id="panel"><div class="card"><div class="badge" id="badge">MOONLIGHT TRAINING</div><h2 id="title">月あかりの訓練場</h2><p id="message">足場を渡って、砲で敵を撃とう。<br>いちばん奥の大型標的を倒せばクリア！</p><button id="start" disabled>素材を読み込み中…</button></div></div></div><div class="controls"><div class="group"><button data-key="left" aria-label="左へ移動">◀</button><button data-key="right" aria-label="右へ移動">▶</button></div><div class="group"><button class="jump" data-key="jump">ジャンプ</button><button class="shoot" data-key="shoot">ショット</button></div></div><p class="hint"><span class="legend">スマホ：</span>ボタンの同時押しで移動＋ジャンプ＋連射。横向きもおすすめ。<br><span class="legend">キーボード：</span>← → 移動 ／ Z・Space ジャンプ ／ X ショット ／ P 一時停止</p><div class="meta">海音ちゃんの操作と素材を試す独立したテストステージ</div></main><script src="game.js"></script></body></html>
