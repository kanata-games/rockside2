<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アスターテ・鎌モーション確認 test.32</title>
<style>body{margin:0;background:#0c1020;color:#e1eafa;font:16px system-ui,sans-serif}main{max-width:820px;margin:auto;padding:20px}h1{font-size:22px;color:#f5ddaa}p{line-height:1.6}canvas{display:block;width:100%;height:auto;background:#181c31;image-rendering:pixelated;border:1px solid #56617c;border-radius:10px;box-sizing:border-box}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,select{min-height:48px;padding:10px 16px;background:#222c44;color:#edf5ff;border:1px solid #869abd;border-radius:8px;font:inherit}button:focus-visible,select:focus-visible{outline:3px solid #91ebfa}a{color:#8ee1ef}small{color:#aebcd3}#label{min-height:26px;color:#f5ddaa}</style>
<main><h1>アスターテさん・鎌の振り払い</h1><p>test.32：通常姿と攻撃を同じシートに揃えました。身体・両手・鎌を一緒に描画しています。左はこれまでのプレイヤー立ち姿、右は今回のモーションです。</p><canvas id="view" width="200" height="104" aria-label="以前の通常姿と新しい攻撃の比較"></canvas>
<nav aria-label="モーション操作"><button id="play">一時停止</button><button id="step">1コマ進む</button><select id="action" aria-label="動作"><option value="first">1段目・振り払い</option><option value="second">2段目・返しの振り払い</option><option value="walk">歩き</option><option value="guard">ガード</option></select><select id="speed" aria-label="速度"><option value="1">通常速度</option><option value="0.5">半分の速度</option></select><button id="face">左向きにする</button></nav><div id="label" role="status" aria-live="polite"></div><small>実際のゲーム画素を拡大しています。記録や進行度には触れずに確認できます。</small><p><a href="./">ゲームへ戻る</a></p></main>
<script>
const canvas=document.getElementById('view'),g=canvas.getContext('2d'),ui=Object.fromEntries(['play','step','action','speed','face','label'].map(k=>[k,document.getElementById(k)]));
let meta,art,old,playing=true,face=1,index=0,elapsed=0,last=0,previousLabel='';
const seq=()=>ui.action.value==='first'?meta.firstSwing:ui.action.value==='second'?meta.secondSwing:ui.action.value==='walk'?[0,1,2,3]:[meta.guardFrame];
const loadImage=url=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url;});
function draw(){if(!meta)return;g.imageSmoothingEnabled=false;g.clearRect(0,0,200,104);g.fillStyle='#303d55';g.fillRect(8,82,184,1);g.save();g.translate(43,82);g.scale(face,1);g.drawImage(old,0,0,192,160,-40,-61.6667,80,66.6667);g.restore();const f=meta.frames[seq()[index]],k=f.scale;g.save();g.translate(137,82);g.scale(face,1);g.drawImage(art,...f.rect,-f.anchor[0]*k,-f.anchor[1]*k,f.rect[2]*k,f.rect[3]*k);g.restore();g.font='8px monospace';g.fillStyle='#bcd1e5';g.fillText('PLAYER / OLD',11,98);g.fillText('PLAYER / TEST.32',104,98);const label=`${ui.action.selectedOptions[0].text}：${index+1} / ${seq().length} コマ`;if(label!==previousLabel){ui.label.textContent=label;previousLabel=label;}}
ui.play.onclick=()=>{playing=!playing;ui.play.textContent=playing?'一時停止':'再生';};ui.step.onclick=()=>{playing=false;ui.play.textContent='再生';index=(index+1)%seq().length;elapsed=0;draw();};ui.face.onclick=()=>{face=-face;ui.face.textContent=face>0?'左向きにする':'右向きにする';draw();};ui.action.onchange=()=>{index=0;elapsed=0;draw();};
function frame(now){const dt=last?Math.min(100,now-last):0;last=now;if(meta&&playing){elapsed+=dt*Number(ui.speed.value);const durations=[6,6,4,4,6,6,4,4],ms=(ui.action.value==='walk'?8:durations[index]||6)*1000/60;if(elapsed>=ms){elapsed-=ms;index=(index+1)%seq().length;}draw();}requestAnimationFrame(frame);}
Promise.all([fetch('assets/astarte-player-sweep.json').then(r=>{if(!r.ok)throw Error();return r.json();}),loadImage('assets/astarte-player-sweep.png'),loadImage('assets/astarte-sequel.png')]).then(([m,a,o])=>{meta=m;art=a;old=o;draw();requestAnimationFrame(frame);}).catch(()=>ui.label.textContent='画像を読み込めませんでした。ページを再読み込みしてください。');
</script></html>
